<!doctype html>
<html lang="id" data-theme="light" data-build="GALILEA-ADMIN-PRO-50-0-0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="admin-build-commit" content="__ADMIN_BUILD_COMMIT__">
    <meta name="theme-color" content="#f8f8f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
  <style>
  /* ═══════════════════════════════════════════════════════════════════════
     GMAHK GALILEA — ADMIN COMMAND CENTER v50.0
     Visual Direction: Premium Editorial · Calm · Precise · Monochrome
     No green. Dense information hierarchy. Desktop productivity feel.
     ═══════════════════════════════════════════════════════════════════════ */

  /* GALILEA-ADMIN-BOOTSTRAP-35-8-0 */

  /* ── 1. DESIGN TOKENS ──────────────────────────────────────────────── */
  :root {
    /* Foundation */
    --bg:            #f8f8f7;
    --sidebar-bg:    #ffffff;
    --surface:       #ffffff;
    --surface-2:     #f4f4f2;
    --surface-3:     #ebebea;
    --surface-hover: #f0f0ef;
    --surface-translucent: rgba(248, 248, 247, 0.94);

    /* Typography */
    --text:    #111110;
    --soft:    #6b6b68;
    --faint:   #9b9b97;
    --inverse: #ffffff;

    /* Structure */
    --line:        #e4e4e1;
    --line-subtle: rgba(228, 228, 225, 0.5);
    --line-strong: #d0d0cc;

    /* Accent — restrained indigo/slate */
    --accent:          #3b3bfc;
    --accent-hover:    #2929d9;
    --accent-soft:     #f0f0ff;
    --accent-text:     #1f1fcc;

    /* Semantic */
    --danger:      #c0392b;
    --danger-soft: #fdecea;
    --warning:     #c97a08;
    --warning-soft:#fef3cd;
    --success:     #1a7a45;
    --success-soft:#edf7f1;

    /* Buttons */
    --btn-primary-bg:   #111110;
    --btn-primary-text: #f8f8f7;
    --btn-primary-hover:#2a2a28;

    /* Elevation */
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-sm: 0 2px 6px rgba(0,0,0,0.07);
    --shadow:    0 4px 16px rgba(0,0,0,0.09);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.13);

    /* Layout */
    --sidebar: 220px;
    --topbar:  52px;
    --radius-sm: 7px;
    --radius:    10px;
    --radius-lg: 14px;
    --radius-xl: 18px;

    /* Motion */
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur:  0.18s;

    /* Spacing scale */
    --sp-1:  4px;
    --sp-2:  8px;
    --sp-3:  12px;
    --sp-4:  16px;
    --sp-6:  24px;
    --sp-8:  32px;
    --sp-12: 48px;
    --sp-16: 64px;
  }

  [data-theme="dark"] {
    --bg:            #111110;
    --sidebar-bg:    #0c0c0b;
    --surface:       #161614;
    --surface-2:     #1d1d1b;
    --surface-3:     #252522;
    --surface-hover: #1e1e1c;
    --surface-translucent: rgba(12, 12, 11, 0.95);

    --text:    #ededea;
    --soft:    #a5a5a0;
    --faint:   #6b6b66;
    --inverse: #111110;

    --line:        #2a2a27;
    --line-subtle: rgba(42, 42, 39, 0.5);
    --line-strong: #333330;

    --accent:       #5b5bff;
    --accent-hover: #6e6eff;
    --accent-soft:  #16163a;
    --accent-text:  #8888ff;

    --danger:      #e57373;
    --danger-soft: #2d1515;
    --warning:     #f59e0b;
    --warning-soft:#2a1f0a;
    --success:     #4caf70;
    --success-soft:#152a1d;

    --btn-primary-bg:   #ededea;
    --btn-primary-text: #111110;
    --btn-primary-hover:#d8d8d4;

    --shadow-xs: 0 1px 2px rgba(0,0,0,0.5);
    --shadow-sm: 0 2px 6px rgba(0,0,0,0.6);
    --shadow:    0 4px 16px rgba(0,0,0,0.7);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.8);
  }

  /* ── 2. RESET ──────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box }
  html, body { min-height: 100%; margin: 0; max-width: 100%; overflow-x: hidden }
  html { background: var(--bg); scroll-behavior: smooth; color-scheme: light }
  html[data-theme="dark"] { color-scheme: dark }

  body {
    min-width: 0;
    color: var(--text);
    background: var(--bg);
    font: 13.5px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overscroll-behavior-x: none;
  }

  button, input, select, textarea { font: inherit }
  button, a { color: inherit }
  button { cursor: pointer; border: 0; background: transparent }
  a { text-decoration: none }
  img { display: block; max-width: 100% }
  h1, h2, h3, p { margin-top: 0 }
  h1, h2, h3 { line-height: 1.08; letter-spacing: -0.035em; font-weight: 750 }
  h1 { font-size: clamp(1.9rem, 4vw, 3.4rem) }
  h2 { font-size: clamp(1.4rem, 2.5vw, 2rem) }
  h3 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em }
  h1, h2, h3, p, strong, span, label, small, button, a, dd, dt, pre { overflow-wrap: anywhere }

  .muted { color: var(--soft) }
  .faint { color: var(--faint) }
  .small { font-size: 0.76rem }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ── 3. ICONS ──────────────────────────────────────────────────────── */
  .icon {
    width: 16px; height: 16px; display: block;
    fill: none; stroke: currentColor;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
    flex: 0 0 auto;
  }

  /* ── 4. APP SHELL ──────────────────────────────────────────────────── */
  .admin-shell {
    min-height: 100vh;
    display: grid;
    grid-template-columns: var(--sidebar) minmax(0, 1fr);
  }

  .admin-shell, .workspace, .content, .topbar, .sidebar, .page-head, .toolbar,
  .record-grid, .quick-grid, .grid, .card, .record, .metric, .quick-action,
  .workflow-item, .approval-card, .service-card, .user-card, .payload,
  .modal-head, .modal-body, .modal-foot, .form-grid, .field {
    min-width: 0;
    max-width: 100%;
  }

  /* ── 5. SIDEBAR ────────────────────────────────────────────────────── */
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 70;
    width: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 12px 8px 12px;
    border-right: 1px solid var(--line);
    background: var(--sidebar-bg);
    overflow: hidden;
  }

  /* Brand / Logo area */
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 8px 12px;
    border-bottom: 1px solid var(--line);
    transition: opacity var(--dur) var(--ease);
    flex: 0 0 auto;
  }
  .brand:hover { opacity: 0.75 }
  .brand strong, .brand span { display: block; overflow-wrap: anywhere }
  .brand strong {
    font-size: 0.83rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    color: var(--text);
  }
  .brand span {
    margin-top: 1px;
    color: var(--faint);
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* Nav scroll */
  .nav-scroll {
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 0 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    flex: 1 1 auto;
  }

  /* Section label */
  .nav-label {
    margin: 14px 10px 4px;
    color: var(--faint);
    font-size: 0.57rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* Nav items */
  .nav-item {
    position: relative;
    width: 100%;
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    color: var(--soft);
    background: transparent;
    text-align: left;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: -0.008em;
    transition: all var(--dur) var(--ease);
  }
  .nav-item:hover {
    color: var(--text);
    background: var(--surface-2);
  }
  .nav-item.active {
    color: var(--text);
    background: var(--surface-3);
    font-weight: 700;
  }
  .nav-item.active::before {
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 2.5px;
    content: "";
    background: var(--text);
    border-radius: 0 2px 2px 0;
  }
  .nav-item .count {
    margin-left: auto;
    min-width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
    border-radius: 999px;
    color: var(--inverse);
    background: var(--danger);
    font-size: 0.58rem;
    font-weight: 800;
  }

  /* Sidebar user card */
  .sidebar-user {
    flex: 0 0 auto;
    padding: 8px;
    border-top: 1px solid var(--line);
  }
  .user-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .avatar {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border-radius: 6px;
    color: var(--inverse);
    background: var(--text);
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0;
  }
  .sidebar-user strong, .sidebar-user span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: normal; overflow-wrap: anywhere }
  .sidebar-user strong { font-size: 0.74rem; font-weight: 650 }
  .sidebar-user span { color: var(--faint); font-size: 0.6rem }
  .sidebar-user .user-row > span:last-child { min-width: 0 }
  .build-badge { display: none !important }

  /* ── 6. TOPBAR ─────────────────────────────────────────────────────── */
  .workspace {
    min-width: 0;
    grid-column: 2;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 45;
    min-height: var(--topbar);
    height: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    padding: 0 clamp(16px, 3vw, 40px);
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .crumb { min-width: 0 }
  .crumb strong, .crumb span { display: block }
  .crumb strong { font-size: 0.85rem; font-weight: 700; letter-spacing: -0.015em }
  .crumb span { color: var(--faint); font-size: 0.65rem; letter-spacing: 0 }
  .top-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto }
  .mobile-menu { display: none }
  .mobile-overlay { display: none }

  /* ── 7. CONTENT AREA ───────────────────────────────────────────────── */
  .content {
    flex: 1 0 auto;
    width: min(1320px, calc(100% - clamp(24px, 4vw, 72px)));
    margin: 0 auto;
    padding: clamp(24px, 4vw, 48px) 0 72px;
  }

  /* ── 8. DASHBOARD ──────────────────────────────────────────────────── */
  .editorial-welcome { margin-bottom: var(--sp-8) }
  .welcome-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .welcome-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--faint);
    text-transform: uppercase;
  }
  .eyebrow-sep { opacity: 0.4 }
  .welcome-title {
    margin-bottom: 4px;
    font-size: clamp(1.9rem, 4vw, 3rem);
    line-height: 1.04;
    letter-spacing: -0.04em;
  }
  .welcome-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 12px;
    margin-bottom: 16px;
  }
  .welcome-meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--soft);
    font-size: 0.76rem;
    font-weight: 500;
  }
  .welcome-meta-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--faint);
  }
  .welcome-meta-status { color: var(--text); font-weight: 650 }
  .welcome-sub {
    max-width: 520px;
    color: var(--soft);
    font-size: 0.84rem;
    line-height: 1.65;
    margin-bottom: 0;
  }
  .welcome-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 18px;
  }

  /* Dashboard sync strip */
  .dashboard-sync-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 14px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 0.69rem;
    color: var(--soft);
  }
  .sync-meta { display: flex; align-items: center; gap: 6px }
  .sync-meta .icon { width: 13px; height: 13px; color: var(--faint) }
  .dashboard-sync-strip.is-loading .icon { animation: spin 1.2s linear infinite }
  .dashboard-sync-strip.is-error { color: var(--danger); background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, var(--line)) }
  .btn-sync {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--surface);
    font-size: 0.65rem;
    font-weight: 600;
    color: var(--text);
    transition: all var(--dur) var(--ease);
  }
  .btn-sync:hover { border-color: var(--line-strong); background: var(--surface-hover) }

  /* ── 9. METRICS BAR ────────────────────────────────────────────────── */
  .editorial-metrics-section { margin-bottom: var(--sp-8) }
  .section-label {
    color: var(--faint);
    font-size: 0.57rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .editorial-metrics-bar {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
    overflow: hidden;
  }
  .metric-block {
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 96px;
    transition: background var(--dur) var(--ease);
    cursor: default;
  }
  .metric-block:hover { background: var(--surface-hover) }
  .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 6px }
  .metric-name { color: var(--faint); font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em }
  .metric-icon-small { color: var(--faint); opacity: 0.7 }
  .metric-icon-small .icon { width: 13px; height: 13px }
  .metric-number {
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    margin: 6px 0 2px;
    color: var(--text);
  }
  .metric-caption { color: var(--soft); font-size: 0.68rem }
  .metric-divider { width: 1px; background: var(--line) }

  /* ── ATTENTION SECTION ─────────────────────────────────────────────── */
  .dashboard-attention-section { margin-bottom: var(--sp-8) }
  .attention-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .attention-header h2 { font-size: 0.96rem; font-weight: 700; letter-spacing: -0.015em; margin: 0 }
  .attention-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 0.58rem;
    font-weight: 800;
  }
  .attention-list { display: grid; gap: 5px }
  .attention-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    text-align: left;
    transition: all var(--dur) var(--ease);
    cursor: pointer;
  }
  .attention-item:hover { border-color: var(--line-strong); background: var(--surface-hover) }
  .attention-count {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--text);
    min-width: 32px;
    line-height: 1;
  }
  .attention-text strong { display: block; font-size: 0.82rem; font-weight: 650; color: var(--text) }
  .attention-text span { display: block; margin-top: 1px; color: var(--soft); font-size: 0.7rem }
  .attention-arrow { margin-left: auto; color: var(--faint) }

  /* ── MINI ACTIVITY ─────────────────────────────────────────────────── */
  .dashboard-activity-section { margin-bottom: var(--sp-8) }
  .activity-mini-list { display: grid; gap: 2px }
  .activity-mini-row {
    display: grid;
    grid-template-columns: 48px minmax(0, 1fr);
    align-items: start;
    gap: 6px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .activity-mini-row:last-child { border-bottom: 0 }
  .activity-mini-time { color: var(--faint); font-size: 0.65rem; font-weight: 600; padding-top: 1px }
  .activity-mini-text strong { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text) }
  .activity-mini-text span { display: block; margin-top: 1px; color: var(--soft); font-size: 0.68rem }

  /* ── TOAST ─────────────────────────────────────────────────────────── */
  .toast-undo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 5px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--accent);
    font-size: 0.74rem;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .toast-undo:hover { opacity: 0.8 }

  /* ── 10. QUICK ACTIONS GRID ────────────────────────────────────────── */
  .editorial-actions-section { margin-bottom: var(--sp-8) }
  .section-head-clean { margin-bottom: 12px }
  .section-head-clean h2 { font-size: 1.15rem; font-weight: 750; letter-spacing: -0.025em; margin: 0 }
  .actions-list-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 8px;
  }
  .action-tile {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    text-align: left;
    transition: all var(--dur) var(--ease);
  }
  .action-tile:hover { border-color: var(--line-strong); background: var(--surface-hover); transform: translateY(-1px); box-shadow: var(--shadow-sm) }
  .action-tile-icon {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    flex: 0 0 auto;
    border-radius: 7px;
    color: var(--soft);
    background: var(--surface-2);
  }
  .action-tile-icon .icon { width: 17px; height: 17px }
  .action-tile:hover .action-tile-icon { background: var(--surface-3); color: var(--text) }
  .action-tile-body { flex: 1 1 auto; min-width: 0 }
  .action-tile-body strong { display: block; font-size: 0.84rem; font-weight: 700; letter-spacing: -0.01em }
  .action-tile-body span { display: block; color: var(--soft); font-size: 0.69rem; line-height: 1.4; margin-top: 1px }
  .action-tile-arrow { color: var(--faint); opacity: 0.5; transition: transform var(--dur) var(--ease); flex: 0 0 auto }
  .action-tile:hover .action-tile-arrow { opacity: 1; transform: translateX(2px) }

  /* ── 11. BUTTONS ────────────────────────────────────────────────────── */
  .btn {
    position: relative;
    overflow: hidden;
    min-height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 6px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    background: var(--surface);
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
    letter-spacing: -0.008em;
    transition: all var(--dur) var(--ease);
  }
  .btn:hover { background: var(--surface-hover); border-color: var(--line-strong); transform: translateY(-1px) }
  .btn.primary {
    color: var(--btn-primary-text);
    border-color: transparent;
    background: var(--btn-primary-bg);
  }
  .btn.primary:hover { background: var(--btn-primary-hover) }
  .btn.soft {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 25%, var(--line));
    background: var(--accent-soft);
  }
  .btn.soft:hover { background: color-mix(in srgb, var(--accent-soft) 70%, var(--accent)) }
  .btn.danger {
    color: var(--danger);
    border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
    background: var(--danger-soft);
  }
  .btn.danger:hover { border-color: var(--danger); background: color-mix(in srgb, var(--danger-soft) 65%, var(--danger)) }
  .btn:disabled { opacity: 0.42; cursor: not-allowed; transform: none !important }
  .button-row { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0 }
  .icon-btn {
    width: 34px; height: 34px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--soft);
    background: var(--surface);
    transition: all var(--dur) var(--ease);
  }
  .icon-btn:hover { color: var(--text); border-color: var(--line-strong); background: var(--surface-hover) }

  /* ── 12. PAGE HEAD & EYEBROW ───────────────────────────────────────── */
  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .page-head h1 { margin-bottom: 3px; font-size: clamp(1.65rem, 3.4vw, 2.6rem); letter-spacing: -0.035em }
  .page-head p { color: var(--soft); margin: 0; font-size: 0.85rem }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 5px;
    color: var(--faint);
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .eyebrow::before { width: 12px; height: 1.5px; content: ""; background: currentColor }

  /* ── 13. TOOLBAR ────────────────────────────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .toolbar :is(input, select, .search) { min-height: 32px; max-width: 100% }
  .search {
    min-width: 180px;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
  }
  .search input {
    width: 100%; height: 30px;
    border: 0; outline: 0;
    color: var(--text); background: transparent;
    font-size: 0.8rem;
  }
  .filters { display: flex; gap: 5px }

  /* ── 14. FORMS ──────────────────────────────────────────────────────── */
  select, input, textarea {
    width: 100%;
    min-height: 38px;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    background: var(--surface);
    font-size: 0.82rem;
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  }
  select:focus, input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent);
    outline: none;
  }
  textarea { min-height: 110px; resize: vertical }
  option { color: var(--text); background: var(--surface) }
  label { color: var(--soft); font-size: 0.68rem; font-weight: 750; letter-spacing: 0.02em; text-transform: uppercase }
  .field { display: grid; gap: 5px }
  .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
  .field.full { grid-column: 1/-1 }
  .help { color: var(--faint); font-size: 0.64rem; line-height: 1.5 }

  /* ── 15. TABLES & RECORDS ──────────────────────────────────────────── */
  .record-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 10px;
  }
  .card {
    position: relative;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
    transition: all var(--dur) var(--ease);
  }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-sm) }
  .record {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 16px 18px;
    height: 100%;
  }
  .record-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .record h3 { margin: 8px 0 5px; font-size: 1rem }
  .record-summary {
    display: -webkit-box;
    overflow: hidden;
    color: var(--soft);
    font-size: 0.75rem;
    line-height: 1.5;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .record-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding-top: 12px;
    align-self: end;
    justify-content: flex-end;
  }
  .record-actions .btn { flex: 1 1 80px }

  /* ── 16. STATUS PILLS ──────────────────────────────────────────────── */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 22px;
    padding: 0 8px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--soft);
    background: var(--surface-2);
    font-size: 0.6rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .status::before {
    width: 5px; height: 5px;
    border-radius: 50%; content: "";
    background: var(--faint);
  }
  .status.publish::before, .status.approved::before { background: var(--success) }
  .status.pending::before { background: var(--warning) }
  .status.rejected::before { background: var(--danger) }
  .status.draft::before { background: var(--faint) }

  [data-theme="light"] .status { color: #333332; background: #f2f2f0; border-color: #e0e0dd }
  [data-theme="dark"] .status { color: #c8c8c4; background: #1e1e1c; border-color: #2a2a27 }

  /* ── 17. WORKFLOW ──────────────────────────────────────────────────── */
  .workflow-strip { display: grid; gap: 7px; margin-bottom: 16px }
  .workflow-item {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) minmax(160px, auto);
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .workflow-item strong, .workflow-item span { display: block }
  .workflow-item span { color: var(--faint); font-size: 0.66rem }
  .workflow-item .button-row { justify-content: flex-end }
  .workflow-copy { display: grid; gap: 2px; min-width: 0 }
  .workflow-note {
    margin-top: 3px;
    padding: 5px 8px;
    border-left: 2.5px solid var(--warning);
    border-radius: 0 5px 5px 0;
    color: var(--soft);
    background: var(--surface-2);
    font-size: 0.69rem;
  }
  .workflow-guide {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
    margin-bottom: 16px;
  }
  .workflow-step {
    position: relative;
    display: grid;
    gap: 2px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--faint);
    background: var(--surface-2);
  }
  .workflow-step::after {
    position: absolute;
    top: 50%; right: -7px;
    width: 7px; height: 1px;
    content: ""; background: var(--line);
  }
  .workflow-step:last-child::after { display: none }
  .workflow-step b { font-size: 0.64rem; letter-spacing: 0.02em }
  .workflow-step span { font-size: 0.59rem }
  .workflow-step.active { color: var(--text); border-color: var(--line-strong); background: var(--surface); box-shadow: inset 2.5px 0 0 var(--text) }
  .workflow-step.done { color: var(--soft) }

  .status-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .status-legend > span:last-child {
    align-self: center;
    margin-left: auto;
    color: var(--faint);
    font-size: 0.66rem;
  }

  /* ── 18. APPROVALS ──────────────────────────────────────────────────── */
  .approval-tabs {
    position: sticky;
    z-index: 8;
    top: calc(var(--topbar) + 8px);
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(16px);
    margin-bottom: 14px;
  }
  .approval-tab {
    min-height: 30px;
    padding: 5px 12px;
    border: 0;
    border-radius: 5px;
    color: var(--soft);
    background: transparent;
    font-weight: 700;
    font-size: 0.75rem;
    transition: all var(--dur) var(--ease);
  }
  .approval-tab:hover { color: var(--text); background: var(--surface-2) }
  .approval-tab.active { color: var(--text); background: var(--surface-3) }
  .approval-list { display: grid; gap: 9px }
  .approval-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
  }
  .approval-card > div:first-child { min-width: 0 }
  .approval-card h3 { font-size: 1.05rem; margin-top: 9px }
  .approval-card > .button-row { min-width: 150px; justify-content: flex-end }
  .approval-meta, .service-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 10px;
    color: var(--faint);
    font-size: 0.67rem;
  }
  .payload {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
    gap: 6px 12px;
    margin-top: 10px;
    padding: 10px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .payload div { min-width: 0 }
  .payload small, .payload strong { display: block }
  .payload small { color: var(--faint); font-size: 0.58rem; text-transform: uppercase; font-weight: 750; letter-spacing: 0.05em }
  .payload strong { margin-top: 2px; font-size: 0.74rem; line-height: 1.4; color: var(--soft); font-weight: 500 }
  .payload .payload-wide { grid-column: 1/-1 }

  /* ── 19. SERVICES ───────────────────────────────────────────────────── */
  .service-list { display: grid; gap: 10px }
  .service-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(170px, 0.35fr);
    align-items: center;
    gap: 16px;
    padding: 18px;
  }
  .service-card h3 { margin: 7px 0 4px; font-size: 1.05rem }
  .service-card p { max-width: 680px; margin: 0 0 7px; line-height: 1.6; white-space: pre-wrap }
  .service-actions { display: flex; flex-wrap: wrap; gap: 5px; align-content: center; justify-content: flex-end }
  .service-actions .btn { justify-content: center }
  .privacy-chip {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 8px;
    border-radius: 999px;
    color: var(--text);
    background: var(--surface-3);
    font-size: 0.6rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .service-card.restricted { border-style: dashed }
  [data-theme="light"] .privacy-chip { color: #222220 }
  [data-theme="dark"] .privacy-chip { color: #ededea }

  /* ── 20. USERS ──────────────────────────────────────────────────────── */
  .user-list { display: grid; gap: 9px }
  .user-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 16px;
  }
  .user-card .button-row { align-self: center }
  .role-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .role-card {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .role-card strong, .role-card span { display: block }
  .role-card strong { font-weight: 800; font-size: 0.84rem }
  .role-card span { margin-top: 3px; color: var(--soft); font-size: 0.66rem; line-height: 1.4 }

  /* ── 21. ACTIVITY ───────────────────────────────────────────────────── */
  .activity-list { display: grid; gap: 7px }
  .activity-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: start;
    gap: 10px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .activity-dot {
    width: 8px; height: 8px;
    margin-top: 5px;
    border: 2px solid var(--surface-3);
    border-radius: 50%;
    background: var(--soft);
  }
  .activity-row strong, .activity-row span { display: block }
  .activity-row span { color: var(--soft); font-size: 0.69rem }
  .activity-row time { color: var(--faint); font-size: 0.63rem; text-align: right }

  /* ── 22. DIALOGS / MODALS ──────────────────────────────────────────── */
  dialog {
    width: min(680px, calc(100vw - 20px));
    max-height: calc(100dvh - 20px);
    max-width: min(680px, calc(100vw - 20px));
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 18px;
    margin: auto;
    overflow: hidden;
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
  }
  dialog::backdrop {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  dialog[open] { display: flex; flex-direction: column }
  dialog > form {
    width: 100%; min-width: 0;
    max-height: calc(100dvh - 20px);
    display: flex; flex-direction: column;
  }
  .modal-head {
    position: sticky; top: 0; z-index: 2;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .modal-head > div:first-child { min-width: 0 }
  .modal-head strong, .modal-head span { display: block; overflow-wrap: anywhere }
  .modal-head strong { font-size: 0.94rem; font-weight: 700 }
  .modal-body {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto;
    padding: clamp(16px, 3vw, 24px);
  }
  .modal-foot {
    position: sticky; bottom: 0;
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }

  /* Review reason */
  .review-title { margin: 10px 0 3px }
  .review-reason {
    display: none;
    margin-top: 12px;
    padding: 12px;
    border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--line));
    border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--danger) 4%, var(--surface));
    scroll-margin: 12px;
  }
  .review-reason.show { display: grid !important; gap: 10px; animation: reason-in 0.22s var(--ease) }
  .reason-head { display: flex; gap: 8px; align-items: flex-start }
  .reason-head .icon { margin-top: 2px; color: var(--danger) }
  .reason-head strong, .reason-head span { display: block }
  .reason-head span { margin-top: 2px; color: var(--soft); font-size: 0.69rem }
  .review-reason textarea { min-height: 100px; border-color: color-mix(in srgb, var(--danger) 25%, var(--line)); background: var(--surface) }
  .reason-help { color: var(--faint); font-size: 0.64rem }
  .reason-help.error { color: var(--danger); font-weight: 800 }
  @keyframes reason-in { from { opacity: 0; transform: translateY(4px) } }

  /* ── 23. EDITOR PREVIEW ─────────────────────────────────────────────── */
  .editor-preview {
    display: none;
    grid-column: 1/-1;
    margin-top: 5px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .editor-preview.show { display: block }
  .editor-preview-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .editor-preview-card {
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface);
  }
  .editor-preview-card h3 { margin: 3px 0 5px }
  .editor-preview-card dl {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    margin: 10px 0 0;
  }
  .editor-preview-card dl div { padding: 7px 9px; border-radius: 5px; background: var(--surface-2) }
  .editor-preview-card dt { color: var(--faint); font-size: 0.6rem; font-weight: 800; text-transform: uppercase }
  .editor-preview-card dd { margin: 2px 0 0; white-space: pre-wrap }
  .editor-validation { display: grid; gap: 5px; margin-bottom: 10px }
  .editor-validation-row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 9px;
    border-radius: var(--radius-sm);
    color: var(--soft);
    background: var(--surface);
  }
  .editor-validation-row.ready .icon { color: var(--success) }
  .editor-validation-row.warning .icon { color: var(--warning) }

  /* Projector */
  .editor-projector {
    position: relative;
    aspect-ratio: 16/9;
    display: grid;
    grid-template-columns: minmax(110px, 0.62fr) minmax(0, 1.38fr);
    gap: 10px;
    padding: 12px;
    overflow: hidden;
    border-radius: var(--radius-sm);
    color: #fff;
    background: linear-gradient(135deg, #1a1a1a, #2d2d2d);
  }
  .editor-projector::after {
    position: absolute; inset: 5px;
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 9px; content: "";
    pointer-events: none;
  }
  .editor-projector > * { position: relative; z-index: 1 }
  .editor-projector-title {
    display: flex; min-width: 0; flex-direction: column; justify-content: flex-end;
    padding: 10px; border-radius: 9px; background: rgba(0,0,0,0.3);
  }
  .editor-projector-title small { color: rgba(255,255,255,0.55); font-size: 0.52rem; font-weight: 800; letter-spacing: 0.1em }
  .editor-projector-title strong { margin-top: 4px; font-size: clamp(0.95rem, 2.4vw, 1.6rem); line-height: 0.94 }
  .editor-projector-title span { margin-top: 4px; color: rgba(255,255,255,0.65); font-size: 0.59rem }
  .editor-projector-fields {
    display: grid; align-content: center;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 3px 8px; margin: 0; padding: 9px;
    border-radius: 9px; background: rgba(0,0,0,0.22);
  }
  .editor-projector-fields div { min-width: 0; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.12) }
  .editor-projector-fields dt { color: rgba(255,255,255,0.5); font-size: 0.45rem; font-weight: 800; text-transform: uppercase }
  .editor-projector-fields dd { margin: 1px 0 0; overflow: hidden; font-size: clamp(0.62rem, 1.3vw, 0.9rem); font-weight: 750; line-height: 1.05; text-overflow: ellipsis; white-space: nowrap }

  /* ── 24. IMAGE & MEDIA UPLOAD ─────────────────────────────────────── */
  .image-upload-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 7px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
  }
  .image-upload-panel strong, .image-upload-panel span { display: block }
  .image-upload-panel > div { min-width: 0; flex: 1 1 auto; }
  .image-upload-panel > label { flex: 0 0 auto; white-space: nowrap; }
  .image-upload-panel span { margin-top: 2px; color: var(--soft); font-size: 0.68rem; }
  .image-collection { min-height: 120px }

  /* Upload items */
  .upload-preview-list { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-direction: column; gap: 6px }
  .upload-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px; border-radius: var(--radius-sm); background: var(--surface-2);
    font-size: 13px; border: 1px solid var(--line);
  }
  .upload-info { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
  .upload-name { font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-thumb {
    position: relative;
    flex: 0 0 auto;
    overflow: hidden;
    background: var(--surface-3);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    margin-right: 12px;
  }
  .media-thumb.sq-64 { width: 64px; height: 64px; }
  .media-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .media-thumb-broken {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: var(--faint);
    font-size: 20px;
    text-align: center;
  }
  .upload-size { color: var(--faint); font-size: 11px }
  .upload-status { font-weight: 500 }
  .upload-item.pending .upload-status { color: var(--faint) }
  .upload-item.success .upload-status { color: var(--success) }
  .upload-item.error .upload-status { color: var(--danger) }
  .upload-item.success { background: var(--success-soft); border-color: color-mix(in srgb, var(--success) 30%, var(--line)) }
  .upload-item.error { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 30%, var(--line)) }
  .upload-item.is-primary { border-color: var(--accent) !important; border-width: 2px !important; background: var(--accent-soft) !important }
  .photo-primary-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700 }
  .btn-set-primary-row { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 10px; font-weight: 600; cursor: pointer; color: var(--text); transition: all var(--dur) var(--ease) }
  .btn-set-primary-row:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft) }
  .btn-remove-photo-row { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 11px; cursor: pointer; color: var(--soft); transition: all var(--dur) var(--ease); flex: 0 0 auto }
  .btn-remove-photo-row:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft) }
  .photo-list { display: grid; gap: 6px; margin: 8px 0 }

  /* Media manager */
  .media-manager { display: grid; gap: 6px; margin: 8px 0 }

  /* Rich editor */
  .rich-editor { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); overflow: hidden; display: flex; flex-direction: column }
  .rich-editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent) }
  .rich-toolbar { display: flex; flex-wrap: wrap; gap: 3px; padding: 5px; border-bottom: 1px solid var(--line); background: var(--surface-2) }
  .rich-toolbar button { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 4px; color: var(--text); transition: background var(--dur) }
  .rich-toolbar button:hover { background: var(--surface-3) }
  .rich-toolbar button.active { background: var(--surface-3); color: var(--accent) }
  .rich-toolbar button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
  .rich-toolbar-sep { width: 1px; background: var(--line); margin: 3px }
  .rich-content { min-height: 140px; padding: 10px; font-size: 13.5px; line-height: 1.6; outline: none; overflow-y: auto; max-height: 380px }
  .rich-content p { margin: 0 0 1em }
  .rich-content p:last-child { margin-bottom: 0 }
  .rich-content ul, .rich-content ol { margin: 0 0 1em; padding-left: 22px }
  .rich-content li { margin-bottom: 3px }
  .rich-content a { color: var(--accent); text-decoration: underline }

  /* Photo manager */
  .photo-manager { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 10px }
  .photo-thumb { position: relative; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); aspect-ratio: 1; display: flex; flex-direction: column }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover }
  .photo-thumb-actions { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity var(--dur); gap: 6px }
  .photo-thumb:hover .photo-thumb-actions { opacity: 1 }
  .photo-thumb.is-primary .photo-thumb-actions { opacity: 1; background: transparent; justify-content: flex-start; align-items: flex-end; padding: 6px }
  .btn-set-primary { background: var(--bg); color: var(--text); border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: 500; cursor: pointer }
  .btn-set-primary:hover { background: var(--surface-3) }
  .photo-badge-primary { background: var(--text); color: var(--inverse); padding: 3px 7px; border-radius: 4px; font-size: 9px; font-weight: 700 }
  .btn-remove-photo { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.5); color: #fff; border: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer }
  .btn-remove-photo:hover { background: var(--danger) }

  /* ── 25. EMPTY STATE ────────────────────────────────────────────────── */
  .empty {
    padding: 40px 16px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    color: var(--soft);
    text-align: center;
  }
  .empty .icon { width: 28px; height: 28px; margin: 0 auto 10px; color: var(--faint) }

  /* ── 26. FOOTER ─────────────────────────────────────────────────────── */
  .admin-footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    padding: 16px clamp(16px, 3vw, 40px);
    margin-top: auto;
    color: var(--faint);
    font-size: 0.68rem;
  }
  .footer-inner {
    width: min(1320px, calc(100% - clamp(24px, 4vw, 72px)));
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* ── 27. LOADER & GATE ──────────────────────────────────────────────── */
  .loader {
    position: fixed; inset: 0; z-index: 300;
    display: grid; place-items: center;
    color: #ededea;
    background: #111110;
    transition: opacity 0.35s var(--ease), visibility 0.35s var(--ease);
  }
  .loader.hidden { opacity: 0; visibility: hidden }
  .loader-mark {
    position: relative;
    width: 100px; height: 100px;
    margin: 0 auto 12px;
    display: grid; place-items: center;
  }
  .loader-mark::before, .loader-mark::after {
    position: absolute; inset: -10px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%; content: "";
    animation: cinema-ring 2.4s var(--ease) infinite;
  }
  .loader-mark::after { inset: -28px; animation-delay: -1.2s }
  @keyframes cinema-ring { 0%, 100% { transform: scale(0.9); opacity: 0.15 } 50% { transform: scale(1.05); opacity: 0.65 } }
  .orbit { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; animation: spin 2.6s linear infinite }
  .orbit::after { position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; border-radius: 50%; content: ""; background: #ededea; transform: translateX(-50%) }
  @keyframes spin { to { transform: rotate(360deg) } }
  .cross { display: none !important }
  .loader-advent { width: 50px; height: 50px; object-fit: contain; filter: none !important; animation: admin-float 2s ease-in-out infinite }
  .loader-note { display: block; margin-top: 4px; color: rgba(255,255,255,0.45); font-size: 0.57rem; font-weight: 700; letter-spacing: 0.14em; text-align: center; text-transform: uppercase }
  .loader p { color: rgba(255,255,255,0.65); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-align: center }
  @keyframes admin-float { 50% { transform: translateY(-4px) } }

  .gate {
    min-height: 100vh; display: grid; place-items: center;
    padding: 20px;
    background: var(--bg);
  }
  .gate-card {
    width: min(600px, 100%);
    padding: clamp(28px, 6vw, 56px);
    border: 1px solid var(--line);
    border-radius: var(--radius-xl);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    text-align: left;
  }
  .gate-logo { width: 54px; height: 54px; margin: 0 0 20px; object-fit: contain; display: block; filter: none !important }
  .gate-card h1 { max-width: 480px; font-size: clamp(2.3rem, 6vw, 4.4rem); letter-spacing: -0.06em }
  .gate-message { font-size: 0.9rem }
  .steps { display: grid; gap: 7px; margin: 20px 0; text-align: left }
  .step { display: flex; gap: 10px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2) }
  .step b { width: 23px; height: 23px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 6px; color: var(--inverse); background: var(--btn-primary-bg); font-size: 0.76rem }

  /* ── 28. TOASTS ─────────────────────────────────────────────────────── */
  .toast-zone { position: fixed; right: 14px; bottom: 14px; z-index: 400; display: grid; gap: 6px }
  .toast {
    max-width: 340px;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    color: var(--text);
    background: var(--surface);
    box-shadow: var(--shadow);
    animation: toast 0.28s var(--ease);
    font-size: 0.77rem;
    font-weight: 600;
  }
  @keyframes toast { from { opacity: 0; transform: translateY(8px) } }

  /* ── 29. LOGO / THEME ───────────────────────────────────────────────── */
  .theme-logo-pair { position: relative; display: grid; flex: 0 0 auto; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; isolation: isolate }
  .theme-logo-pair > img { grid-area: 1/1; width: 100%; height: 100%; object-fit: cover; filter: none !important; opacity: 1; transition: opacity 0.2s var(--ease) }
  .theme-logo-pair .logo-dark { display: none }
  [data-theme="dark"] .theme-logo-pair .logo-light { display: none }
  [data-theme="dark"] .theme-logo-pair .logo-dark { display: block }
  .brand-logo { width: 36px; height: 36px; filter: none !important }
  .brand:hover .theme-logo-pair > img { transform: scale(1.04) }
  .official-advent-logo { display: block; object-fit: contain }
  [data-theme="dark"] .gate-logo { filter: brightness(0) invert(1) }

  /* Active nav state overrides */
  [data-theme="light"] .nav-item { color: var(--soft) }
  [data-theme="light"] .nav-item.active { color: var(--text) }
  [data-theme="dark"] .nav-item { color: var(--soft) }
  [data-theme="dark"] .nav-item.active { color: var(--text) }

  /* Dark mode card overrides */
  [data-theme="dark"] :is(.card, .record, .service-card, .user-card, .metric-block, .action-tile, .role-card, .workflow-item, .toolbar, dialog > form, .editorial-metrics-bar) {
    color: var(--text);
    border-color: var(--line);
    background: var(--surface);
  }
  [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea {
    color: var(--text);
    background: var(--surface-2);
    border-color: var(--line);
  }
  [data-theme="dark"] option { color: var(--text); background: var(--surface-2) }

  /* ── 30. RESPONSIVE ────────────────────────────────────────────────── */
  /* responsive admin lock: iPhone, Android, tablet, dan desktop */
  @media (min-width: 851px) {
    .workspace { margin-left: 0 }
    .content { width: min(1320px, calc(100% - clamp(24px, 4vw, 72px))) }
  }

  @media (max-width: 1100px) {
    .editorial-metrics-bar { grid-template-columns: repeat(2, minmax(0, 1fr)) }
    .metric-divider:nth-child(4) { display: none }
  }

  @media (max-width: 850px) {
    :root { --topbar: 62px }
    .admin-shell { display: block; min-height: 100dvh }
    .workspace { width: 100%; min-height: 100dvh; grid-column: auto }
    .sidebar {
      inset: 0 auto 0 0;
      width: min(84vw, 290px);
      height: 100dvh;
      padding: calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));
      overflow: hidden;
      transform: translate3d(-105%, 0, 0);
      transition: transform 0.28s var(--ease);
    }
    .sidebar.open { transform: translate3d(0, 0, 0) }
    .nav-scroll { overscroll-behavior: contain; -webkit-overflow-scrolling: touch }
    .mobile-menu { display: grid; flex: 0 0 34px }
    .mobile-overlay {
      position: fixed; inset: 0; z-index: 45;
      width: 100vw; height: 100dvh;
      display: block;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0; visibility: hidden;
      transition: opacity 0.26s var(--ease), visibility 0.26s;
    }
    .mobile-overlay.open { opacity: 1; visibility: visible }
    .topbar {
      top: 0;
      width: calc(100% - 14px);
      min-height: var(--topbar);
      margin: calc(5px + env(safe-area-inset-top)) 7px 0;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      border-bottom: 0;
    }
    .crumb { min-width: 0 }
    .crumb strong { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .crumb span { display: none }
    .top-actions { flex: 0 0 auto; flex-wrap: nowrap }
    .top-actions .icon-btn { flex: 0 0 34px }
    .content {
      width: calc(100% - 14px);
      margin-inline: 7px;
      padding: 18px 0 calc(36px + env(safe-area-inset-bottom));
    }
    .welcome-header { flex-direction: column; gap: 14px }
    .welcome-title { font-size: clamp(1.8rem, 9vw, 3rem); line-height: 0.98 }
    .editorial-metrics-bar { grid-template-columns: repeat(2, minmax(0, 1fr)) }
    .actions-list-grid { grid-template-columns: 1fr }
    .approval-card, .service-card, .user-card { grid-template-columns: 1fr }
    .approval-card > .button-row, .service-card > .button-row, .user-card > .button-row { justify-content: flex-start }
    .workflow-item { grid-template-columns: auto minmax(0, 1fr) }
    .workflow-item > .button-row { grid-column: 1/-1; justify-content: flex-start }
    dialog { width: calc(100% - 14px); max-height: calc(100dvh - 14px); border-radius: 16px }
    dialog > form { max-height: calc(100dvh - 14px) }
    .modal-body { padding: 16px 14px; -webkit-overflow-scrolling: touch }
    .modal-head { padding: 10px 12px }
    .modal-foot { padding: 9px 12px calc(9px + env(safe-area-inset-bottom)) }
  }

  @media (max-width: 600px) {
    .editorial-metrics-bar { grid-template-columns: 1fr }
    .metric-divider { display: none }
    .form-grid { grid-template-columns: 1fr }
    .welcome-meta { flex-direction: column; align-items: flex-start; gap: 3px }
    .record { grid-template-columns: 1fr }
    .record-actions { justify-content: flex-start }
    .toolbar, .filters { flex-direction: column; align-items: stretch }
    .toolbar > *, .filters > * { width: 100% !important }
    .service-actions, .record-actions, .user-card .button-row { display: grid; grid-template-columns: 1fr; width: 100% }
    .service-actions .btn, .record-actions .btn, .user-card .btn, .approval-card .btn { width: 100%; justify-content: center }
    .approval-card > .button-row { display: grid; grid-template-columns: 1fr; width: 100% }
    .footer-inner { flex-direction: column; align-items: flex-start; gap: 5px }
    .role-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
    .workflow-guide { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  }

  /* ── 31. REDUCED MOTION ─────────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .orbit, .loader-advent { animation: none !important }
    .loader-mark::before, .loader-mark::after { animation: none !important }
    .theme-logo-pair > img { transition: none }
  }
</style>

  <dialog id="review-dialog"><div class="modal-head"><div><strong>Review Perubahan</strong><span class="small faint" id="review-caption">Periksa isi sebelum mengambil keputusan</span></div><button class="icon-btn" type="button" data-close="review-dialog"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="modal-body" id="review-body"></div><div class="modal-foot" id="review-actions"><button class="btn danger" type="button" data-review="REJECT">Minta revisi</button><button class="btn primary" type="button" data-review="APPROVE"><svg class="icon"><use href="#i-check"/></svg>Setujui &amp; Terbitkan</button></div></dialog>

<script>
  (function(){
    'use strict';
    const APP_URL = <?!= JSON.stringify(appUrl || '') ?>;
    const $=(s,c)=>(c||document).querySelector(s), $$=(s,c)=>Array.from((c||document).querySelectorAll(s));
    const state={boot:null,route:'dashboard',entity:null,entityData:null,search:'',status:'ALL',approvalStatus:'PENDING',approvals:[],approvalCache:{},currentEdit:null,currentReview:null,reviewMode:'',currentService:null,users:[],services:[],activity:null,searchTimer:null,dashboardRequest:0};
    const icon=name=>'<svg class="icon"><use href="#i-'+name+'"/></svg>';
    const logoMark=className=>'<span class="theme-logo-pair '+attr(className||'brand-logo')+'" role="img" aria-label="Logo GMAHK Galilea"><img class="logo-light" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-light.webp" alt=""><img class="logo-dark" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-dark.webp" alt=""></span>';
    const esc=value=>String(value==null?'':value).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    const attr=esc;
    function server(name,args,timeoutMs){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('Server admin belum merespons. Coba kembali; data Anda tidak berubah.'))}},Math.max(8000,Number(timeoutMs)||25000));const finish=fn=>value=>{if(done)return;done=true;clearTimeout(timer);fn(value)};if(typeof google!=='undefined'&&google.script&&google.script.run&&typeof google.script.run[name]==='function'){const runner=google.script.run.withSuccessHandler(finish(resolve)).withFailureHandler(finish(error=>reject(new Error(error&&error.message?error.message:String(error)))));runner[name].apply(runner,args||[]);return}fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:name,args:args||[]})}).then(res=>{if(!res.ok){const ct=res.headers.get('content-type')||'';if(!ct.includes('application/json'))throw new Error('Server mengembalikan error '+res.status+'. Coba kembali.');}return res.json()}).then(payload=>{if(!payload||payload.ok===false){finish(error=>reject(new Error(error&&error.message?error.message:String(error))))(payload&&payload.error?payload.error:'Terjadi gangguan server admin.')}else{finish(resolve)(payload.data!==undefined?payload.data:payload)}}).catch(finish(error=>reject(new Error(error&&error.message?error.message:String(error)))))})}
    function toast(message,undoFn,duration){const el=document.createElement('div');el.className='toast';if(undoFn){el.innerHTML='<span>'+esc(message)+'</span><button class="toast-undo">Urungkan</button>';el.querySelector('.toast-undo').addEventListener('click',()=>{undoFn();el.remove()})}else{el.textContent=message}$('#toasts').append(el);const t=setTimeout(()=>el.remove(),duration||4200);if(undoFn)el.querySelector('.toast-undo').addEventListener('click',()=>clearTimeout(t))}
    function setBusy(button,busy,label){if(!button)return;button.disabled=busy;if(busy){button.dataset.old=button.innerHTML;button.textContent=label||'Memproses…'}else if(button.dataset.old){button.innerHTML=button.dataset.old;delete button.dataset.old}}
    function status(value){const raw=String(value||'DRAFT').toUpperCase(),key=raw.toLowerCase(),labels={DRAFT:'Draf',PENDING:'Menunggu Tinjauan',REVIEW:'Sedang Ditinjau',APPROVED:'Sudah Disetujui',PUBLISH:'Sudah Terbit',REJECTED:'Perlu Revisi'};return '<span class="status '+key+'" title="Status: '+attr(labels[raw]||raw)+'">'+esc(labels[raw]||raw)+'</span>'}
    function friendlyEntity(key){const item=(state.boot.entities||[]).find(e=>e.key===key);return item?item.label:key}
    function initials(name){return String(name||'A').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
    function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('galilea:admin-theme',theme);const button=$('#theme-toggle');if(button)button.innerHTML=icon(theme==='dark'?'sun':'moon')}
    function currentTheme(){return localStorage.getItem('galilea:admin-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}

    function shell(){
      const user=state.boot.user, d=state.boot.dashboard;
      const entityNav=state.boot.entities.filter(e=>!['settings','schedule'].includes(e.key)).map(e=>nav(e.key,e.icon,e.label)).join('');
      return '<div class="admin-shell"><div class="mobile-overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><a class="brand" href="#dashboard">'+logoMark('brand-logo')+'<span><strong>GMAHK Galilea</strong><span>Admin</span></span></a><div class="nav-scroll"><div class="nav-label">OVERVIEW</div>'+nav('dashboard','grid','Dashboard')+'<div class="nav-label">KONTEN</div>'+entityNav+nav('settings','settings','Pengaturan')+'<div class="nav-label">IBADAH</div>'+nav('schedule','calendar','Jadwal Pelayanan')+(user.permissions.edit?'<div class="nav-label">JEMAAT</div>'+nav('services','heart','Layanan Jemaat'):'')+(user.permissions.approve?nav('approvals','check','Persetujuan'):'')+(user.permissions.approve?nav('activity','clock','Aktivitas'):'')+(user.permissions.manageAdmins?nav('users','shield','Pengelola'):'')+(user.permissions.edit?nav('system','settings','Sistem'):'')+'</div><div class="sidebar-user"><div class="user-row"><span class="avatar">'+esc(initials(user.name))+'</span><span><strong>'+esc(user.name)+'</strong><span>'+esc(user.role)+'</span></span></div></div></aside><section class="workspace"><header class="topbar"><div class="button-row"><button class="icon-btn mobile-menu" id="mobile-menu" aria-label="Buka menu">'+icon('menu')+'</button><div class="crumb"><strong id="crumb-title">Dashboard</strong><span>GMAHK Galilea</span></div></div><div class="top-actions"><div style="position:relative"><button class="icon-btn" id="notif-toggle" aria-label="Notifikasi">'+icon('bell')+'<span class="count" id="notif-badge" style="position:absolute;top:-4px;right:-4px;padding:0 4px;font-size:10px" hidden>0</span></button><div id="notif-panel" class="card" style="position:absolute;top:100%;right:0;width:290px;display:none;flex-direction:column;gap:8px;padding:12px;z-index:100;box-shadow:var(--shadow-lg);margin-top:8px"></div></div><a class="icon-btn" href="'+attr(state.boot.publicSite.publicUrl||APP_URL)+'" target="_blank" rel="noopener" title="Buka website">'+icon('external')+'</a><button class="icon-btn" id="theme-toggle" aria-label="Ganti tema">'+icon(currentTheme()==='dark'?'sun':'moon')+'</button></div></header><main class="content" id="content"></main><footer class="admin-footer"><div class="footer-inner"><span>GMAHK Galilea Balikpapan</span><span class="faint">Google Sheets · Vercel Edge</span></div></footer></section></div>';
    }
    function nav(route,iconName,label,count){const value=Math.max(0,Number(count)||0);return '<button class="nav-item" data-route="'+attr(route)+'">'+icon(iconName)+'<span>'+esc(label)+'</span><span class="count" data-nav-count="'+attr(route)+'" '+(value?'':'hidden')+'>'+esc(value)+'</span></button>'}
    function closeSidebar(){$('#sidebar')?.classList.remove('open');$('#overlay')?.classList.remove('open')}
    function routeTitle(){if(state.route==='dashboard')return'Dashboard';if(state.route==='services')return'Layanan Jemaat';if(state.route==='approvals')return'Persetujuan';if(state.route==='activity')return'Audit & Aktivitas';if(state.route==='users')return'Pengelola Portal';if(state.route==='system')return'Sistem & Backup';return friendlyEntity(state.route)}
    function navigate(route){state.route=route;state.search='';state.status='ALL';location.hash=route;$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route===route));$('#crumb-title').textContent=routeTitle();closeSidebar();renderRoute()}

    async function renderRoute(){const box=$('#content');box.innerHTML=loadingCard('Menyiapkan '+routeTitle());try{if(state.route==='dashboard')return renderDashboard();if(state.route==='services')return await loadServices();if(state.route==='approvals')return await loadApprovals();if(state.route==='activity')return await loadActivity();if(state.route==='users')return await loadUsers();if(state.route==='system')return renderSystem();return await loadEntity(state.route)}catch(error){box.innerHTML=errorBox(error.message)}}
    function loadingCard(label){return '<div class="empty"><div class="loader-mark" style="width:72px;height:72px"><span class="orbit"></span>'+logoMark('loader-advent')+'</div><strong>'+esc(label||'Memuat')+'</strong><p class="muted small">Menyambungkan data terbaru…</p></div>'}
    function errorBox(message){return '<div class="empty">'+icon('info')+'<h3>Bagian ini belum dapat dimuat</h3><p>'+esc(cleanError(message))+'</p><button class="btn" data-retry>Coba kembali</button></div>'}
    function cleanError(message){return String(message||'Terjadi gangguan.').replace(/^(?:LOGIN_REQUIRED|ADMIN_NOT_READY|ACCESS_DENIED|FORBIDDEN)\|/,'')}

    function renderDashboard(){
      const d=state.boot.dashboard, u=state.boot.user, canEdit=u.permissions.edit, loading=Boolean(d.loading), publicToday=String(state.boot.publicSite.publicUrl||APP_URL).replace(/#.*$/,'')+'#today';
      const heroActions=canEdit?'<div class="welcome-actions"><button class="btn primary" data-route="worshipPlans">'+icon('plus')+'Siapkan ibadah</button><button class="btn" data-route="schedule">Edit jadwal</button><a class="btn soft" href="'+attr(publicToday)+'" target="_blank" rel="noopener">Mode Operator '+icon('external')+'</a></div>':'';
      const quickItems=canEdit?
        quick('worshipPlans','layout','Susunan Ibadah','Tema, ayat, lagu, dan liturgi Sabat.')+
        quick('themeSong','music','Lagu Tema','Ayat 1, Ayat 2, ayat tambahan, dan Refrain.')+
        quick('announcements','bell','Agenda dan Pengumuman','Warta jemaat aktif dan pengumuman.')+
        quick('activities','newspaper','Berita Jemaat','Dokumentasi kegiatan gereja yang berlangsung.')+
        quick('schedule','calendar','Jadwal Pelayanan','Tugas diaken, khotbah, dan pembagian ibadah.')+
        quick('services','heart','Layanan Jemaat','Tindak lanjuti pokok doa dan kunjungan.')+
        quick('system','settings','Kesehatan Sistem','Pemeriksaan cache, sumber data, dan cadangan.')
        :
        quick('worshipPlans','layout','Susunan Ibadah','Lihat susunan ibadah aktif.')+
        quick('themeSong','music','Lagu Tema','Lihat lirik lagu tema aktif.')+
        quick('announcements','bell','Agenda dan Pengumuman','Lihat informasi warta yang diterbitkan.');

      const syncClass=d.error?' is-error':loading?' is-loading':'';
      const syncText=d.error?'Statistik belum tersambung: '+d.error:loading?'Portal siap. Memperbarui statistik…':'Data terhubung · Google Sheets '+esc(d.scheduleSheet||'Triwulan III 2026')+' · '+d.updatedAt;
      const syncAction=loading?''+'':'<button class="btn-sync" type="button" data-dashboard-refresh>'+icon('refresh')+(d.error?'Coba lagi':'Perbarui')+'</button>';
      const metricValue=value=>loading?'—':value==null?'—':value;

      // Attention section: hanya tampil kalau ada item
      const pendingVal=Number(d.pendingApprovals)||0;
      const draftVal=Number(d.myDrafts)||0;
      const serviceVal=Number(d.serviceRequests)||0;
      const totalAttention=pendingVal+draftVal+serviceVal;
      let attentionItems='';
      if(pendingVal>0)attentionItems+='<button class="attention-item" data-route="approvals"><span class="attention-count">'+pendingVal+'</span><div class="attention-text"><strong>Persetujuan menunggu tinjauan</strong><span>Konten sudah diajukan dan perlu keputusan Anda</span></div><span class="attention-arrow">'+icon('external')+'</span></button>';
      if(draftVal>0)attentionItems+='<button class="attention-item" data-route="approvals"><span class="attention-count">'+draftVal+'</span><div class="attention-text"><strong>Draft belum diajukan</strong><span>Konten dalam proses penulisan</span></div><span class="attention-arrow">'+icon('external')+'</span></button>';
      if(serviceVal>0)attentionItems+='<button class="attention-item" data-route="services"><span class="attention-count">'+serviceVal+'</span><div class="attention-text"><strong>Layanan jemaat perlu tindak lanjut</strong><span>Permohonan baru atau sedang diproses</span></div><span class="attention-arrow">'+icon('external')+'</span></button>';
      const attentionSection=(!loading&&totalAttention>0)?
        '<section class="dashboard-attention-section">'+
          '<div class="attention-header"><h2>Perlu Perhatian</h2><span class="attention-badge">'+totalAttention+'</span></div>'+
          '<div class="attention-list">'+attentionItems+'</div>'+
        '</section>':'';

      $('#content').innerHTML =
        '<section class="editorial-welcome">' +
          '<div class="welcome-eyebrow"><span>GMAHK GALILEA</span><span class="eyebrow-sep">·</span><span>CONTROL CENTER</span></div>' +
          '<h1 class="welcome-title">Selamat datang, '+esc(u.name)+'.</h1>' +
          '<div class="welcome-meta">' +
            '<span class="welcome-meta-item"><span class="welcome-meta-status">'+esc(u.role)+'</span></span>' +
            (d.scheduleSheet?'<span class="welcome-meta-dot"></span><span class="welcome-meta-item">'+esc(d.scheduleSheet)+'</span>':'')+
            (d.systemStatus?'<span class="welcome-meta-dot"></span><span class="welcome-meta-item">'+esc(d.systemStatus)+'</span>':'')+
          '</div>' +
          '<p class="welcome-sub">'+(canEdit?'Kelola seluruh konten website, jadwal ibadah, dan pelayanan jemaat dalam satu ruang kerja yang tenang dan tertata.':'Akses peninjauan Anda siap. Seluruh konten publik dapat diperiksa secara aman.')+'</p>' +
          heroActions +
          '<div class="dashboard-sync-strip'+syncClass+'">' +
            '<span class="sync-meta">'+icon(d.error?'info':'refresh')+'<span>'+esc(syncText)+'</span></span>' +
            syncAction +
          '</div>' +
        '</section>' +
        attentionSection +
        '<section class="editorial-metrics-section">' +
          '<div class="section-label">RINGKASAN AKTIVITAS</div>' +
          '<div class="editorial-metrics-bar">' +
            metric('check', metricValue(d.pendingApprovals), 'Persetujuan', 'Menunggu review', loading) +
            '<div class="metric-divider"></div>' +
            metric('edit', metricValue(d.myDrafts), 'Draft Saya', 'Belum diajukan', loading) +
            '<div class="metric-divider"></div>' +
            metric('bell', metricValue(d.activeAnnouncements), 'Agenda Warta', 'Sedang aktif', loading) +
            '<div class="metric-divider"></div>' +
            metric('heart', metricValue(d.serviceRequests), 'Layanan Jemaat', 'Perlu ditangani', loading) +
          '</div>' +
        '</section>' +
        '<section class="editorial-actions-section">' +
          '<div class="section-head-clean">' +
            '<div>' +
              '<div class="section-label">AKSES CEPAT</div>' +
              '<h2>Tindakan Utama Pelayanan</h2>' +
            '</div>' +
          '</div>' +
          '<div class="actions-list-grid">' + quickItems + '</div>' +
        '</section>';
    }
    function metric(iconName, value, title, subtitle, loading){
      return '<article class="metric-block '+(loading?'is-loading':'')+'">' +
        '<div class="metric-top"><span class="metric-name">'+esc(title)+'</span><span class="metric-icon-small">'+icon(iconName)+'</span></div>' +
        '<strong class="metric-number">'+esc(value)+'</strong>' +
        '<span class="metric-caption">'+esc(subtitle)+'</span>' +
      '</article>';
    }
    function quick(route, iconName, title, description){
      return '<button class="action-tile" data-route="'+route+'">' +
        '<span class="action-tile-icon">'+icon(iconName)+'</span>' +
        '<div class="action-tile-body">' +
          '<strong>'+esc(title)+'</strong>' +
          '<span>'+esc(description)+'</span>' +
        '</div>' +
        '<span class="action-tile-arrow">'+icon('external')+'</span>' +
      '</button>';
    }

    function syncNotifications(){
      if(!state.boot||!state.boot.dashboard)return;
      const d=state.boot.dashboard;
      const pending=Math.max(0,Number(d.pendingApprovals)||0);
      const drafts=Math.max(0,Number(d.myDrafts)||0);
      const services=Math.max(0,Number(d.serviceRequests)||0);
      const total=pending+drafts+services;
      const badge=$('#notif-badge');
      if(badge){badge.textContent=total;badge.hidden=!total}
      const panel=$('#notif-panel');
      if(panel){
        let html='<div style="font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px">Notifikasi</div>';
        if(total===0)html+='<div class="muted small" style="padding:12px 0;text-align:center">Tidak ada pemberitahuan baru.</div>';
        else{
          if(pending>0)html+='<button class="nav-item" data-route="approvals" style="width:100%;justify-content:flex-start;height:auto;padding:8px">'+icon('check')+'<span style="white-space:normal;text-align:left">'+pending+' persetujuan menunggu</span></button>';
          if(drafts>0)html+='<button class="nav-item" data-route="dashboard" style="width:100%;justify-content:flex-start;height:auto;padding:8px">'+icon('edit')+'<span style="white-space:normal;text-align:left">'+drafts+' draft perlu direvisi</span></button>';
          if(services>0)html+='<button class="nav-item" data-route="services" style="width:100%;justify-content:flex-start;height:auto;padding:8px">'+icon('heart')+'<span style="white-space:normal;text-align:left">'+services+' layanan jemaat baru</span></button>';
        }
        panel.innerHTML=html;
      }
    }
    async function loadDashboardSummary(showError){if(!state.boot)return;const request=++state.dashboardRequest;state.boot.dashboard.loading=true;state.boot.dashboard.error='';if(state.route==='dashboard')renderDashboard();try{const result=await server('adminGetDashboardSummary',[],32000);if(request!==state.dashboardRequest)return;if(result&&result.dashboard)state.boot.dashboard=Object.assign({},state.boot.dashboard,result.dashboard,{loading:false,error:''});if(result&&result.publicSite)state.boot.publicSite=Object.assign({},state.boot.publicSite,result.publicSite);syncNotifications();if(state.route==='dashboard')renderDashboard()}catch(error){if(request!==state.dashboardRequest)return;state.boot.dashboard.loading=false;state.boot.dashboard.error=cleanError(error.message);if(state.route==='dashboard')renderDashboard();if(showError)toast(state.boot.dashboard.error)}}

    async function loadActivity(){state.activity=await server('adminGetDashboardActivity',[]);const audit=state.activity.audit||[],health=state.activity.health||[];$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">JEJAK PERUBAHAN</span><h1>Audit & Aktivitas</h1><p>Riwayat tindakan pengelola dan hasil pemeriksaan sumber terakhir.</p></div><button class="btn" data-reload>'+icon('refresh')+'Muat ulang</button></div><div class="grid grid-2"><section><div class="section-head" style="margin-top:0"><h3>Aktivitas terbaru</h3></div><div class="activity-list">'+(audit.length?audit.map(activityHtml).join(''):emptyHtml('Belum ada aktivitas yang tercatat.'))+'</div></section><section><div class="section-head" style="margin-top:0"><h3>Status sumber terakhir</h3></div><div class="activity-list">'+(health.length?health.map(item=>'<article class="activity-row"><span class="activity-dot"></span><div><strong>'+esc(item.source)+'</strong><span>'+esc(item.note||'Tidak ada catatan.')+'</span></div>'+status(item.status)+'</article>').join(''):emptyHtml('Pemeriksaan sistem belum pernah dijalankan.'))+'</div></section></div>'}
    function activityHtml(item){return '<article class="activity-row"><span class="activity-dot"></span><div><strong>'+esc(item.name||item.email)+' · '+esc(item.action)+'</strong><span>'+esc(friendlyEntity(item.entity))+(item.detail?' · '+esc(item.detail):'')+'</span></div><time>'+esc(item.time)+'</time></article>'}

    async function loadEntity(key){state.entity=key;state.entityData=await server('adminListEntity',[key]);renderEntity()}
    function renderEntity(){const data=state.entityData,canEdit=state.boot.user.permissions.edit;let records=data.records||[];const query=state.search.toLowerCase();if(query)records=records.filter(r=>JSON.stringify(r).toLowerCase().includes(query));if(state.status!=='ALL')records=records.filter(r=>String(r.status).toUpperCase()===state.status);const canAdd=canEdit&&data.entity!=='settings';const legend='<div class="status-legend">'+status('DRAFT')+status('PENDING')+status('REJECTED')+status('PUBLISH')+'<span>Hanya konten berstatus Sudah Terbit yang tampil ke jemaat.</span></div>';$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h1>'+esc(data.label)+'</h1><p>Perubahan disimpan sebagai draf, diperiksa, lalu tampil setelah disetujui.</p></div>'+(canAdd?'<button class="btn primary" data-new-record>'+icon('plus')+'Tambah '+esc(data.label)+'</button>':'')+'</div>'+legend+workflowHtml(data.workflows||[])+'<div class="toolbar"><label class="search">'+icon('search')+'<input id="entity-search" placeholder="Cari '+attr(data.label.toLowerCase())+'…" value="'+attr(state.search)+'"></label><div class="filters"><select id="entity-status"><option value="ALL" '+(state.status==='ALL'?'selected':'')+'>Semua status</option><option value="PUBLISH" '+(state.status==='PUBLISH'?'selected':'')+'>Sudah Terbit</option><option value="DRAFT" '+(state.status==='DRAFT'?'selected':'')+'>Draf</option></select><button class="icon-btn" data-reload title="Muat ulang">'+icon('refresh')+'</button></div></div><div class="record-grid">'+(records.length?records.map(recordHtml).join(''):emptyHtml('Belum ada konten yang sesuai.'))+'</div>'}
    function recordHtml(record){
      const isSchedule=state.entity==='schedule',isSetting=state.entity==='settings';
      const values=isSchedule?(record.fields||{}):(record.values||{});
      const pieces=Object.keys(values).map(k=>values[k]).filter(value=>value&&typeof value!=='object');
      const stripHtml = (html) => { const tmp = document.createElement('DIV'); tmp.innerHTML = String(html).replace(/<[^>]+>/g, ' '); return tmp.textContent || tmp.innerText || ''; };
      const rawSummary = isSchedule ? [record.dateLabel,record.time?record.time+' WITA':''].concat(pieces.slice(0,3)).filter(Boolean).join(' � ') : isSetting ? String(values.value||'Belum diisi.') : pieces.slice(1,4).join(' � ');
