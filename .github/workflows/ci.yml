name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy Apps Script backend after checks pass'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Project & Contrast Checks
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.backend.outputs.backend_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine whether Apps Script needs a release
        id: backend
        run: bash scripts/backend-release-needed.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REQUEST_DEPLOY: ${{ inputs.deploy_backend }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run project verification & contrast checks
        run: |
          node tests/check-backend-release.mjs
          npm run check

  deploy:
    name: Apps Script Auto-Sync
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: apps-script-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Authenticate Clasp
        run: |
          echo "Writing clasprc.json..."
          echo "$CLASPRC_JSON" | tr -d '\000' | grep -v '^$' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Configure Clasp Target
        run: |
          echo "Writing .clasp.json..."
          SCRIPT_ID=$(echo "$CLASP_JSON" | tr -d '\000' | grep -o -E '[a-zA-Z0-9_-]{30,}' | head -1)
          if [ -z "$SCRIPT_ID" ]; then
            echo "Error: Could not extract valid Script ID from secret."
            exit 1
          fi
          echo "{\"scriptId\":\"$SCRIPT_ID\", \"rootDir\":\"apps-script-backend\"}" > .clasp.json
          chmod 600 .clasp.json
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}

      - name: Validate Apps Script Source
        run: |
          # Ensure critical files exist before pushing
          if [ ! -f apps-script-backend/Admin.gs ] || [ ! -f apps-script-backend/VercelApi.gs ] || [ ! -f apps-script-backend/appsscript.json ]; then
            echo "Error: Critical backend files are missing from apps-script-backend/"
            exit 1
          fi
          clasp status

      - name: Push and Deploy Admin Portal (USER_ACCESSING)
        run: |
          if [ -z "$DEPLOYMENT_ID_ADMIN" ]; then
            echo "Error: DEPLOYMENT_ID_ADMIN secret is missing."
            exit 1
          fi
          
          # Modify manifest for Admin (USER_ACCESSING)
          jq '.webapp.executeAs = "USER_ACCESSING" | .webapp.access = "ANYONE"' apps-script-backend/appsscript.json > tmp.json && mv tmp.json apps-script-backend/appsscript.json
          
          # Inject build markers
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          sed -i "s/__ADMIN_BUILD_COMMIT__/${SHORT_SHA}/g" apps-script-backend/Admins.html
          echo "Build marker commit injected: $SHORT_SHA"
          
          # Compute pre-push hash
          GITHUB_HASH=$(sha256sum apps-script-backend/Admins.html | awk '{print $1}')
          GITHUB_SIZE=$(wc -c < apps-script-backend/Admins.html | tr -d ' ')
          echo "GitHub Admins.html SHA256: $GITHUB_HASH"
          echo "GitHub Admins.html size: $GITHUB_SIZE bytes"
          
          echo "Pushing Admin Source..."
          clasp push --force
          
          echo "Creating Admin Version..."
          OUTPUT=$(clasp version "Admin: GitHub $GITHUB_SHA")
          VERSION=$(echo "$OUTPUT" | grep -o -E '[0-9]+' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to extract Apps Script version."
            exit 1
          fi
          
          echo "Deploying Admin to version $VERSION..."
          clasp deploy -i "$DEPLOYMENT_ID_ADMIN" -V "$VERSION" -d "Admin: GitHub $GITHUB_SHA"
          
          echo "═══════════════════════════════════════════"
          echo "PHASE A: Verifying Admin Deployment..."
          echo "═══════════════════════════════════════════"
          clasp deployments > deployments.txt
          cat deployments.txt
          
          DEPLOY_LINE=$(grep "$DEPLOYMENT_ID_ADMIN" deployments.txt | grep -v 'web app meta-version' || true)
          
          if [ -z "$DEPLOY_LINE" ]; then
            echo "Error: DEPLOYMENT_ID_ADMIN not found in deployment list!"
            exit 1
          fi
          
          echo "Found deployment: $DEPLOY_LINE"
          
          if echo "$DEPLOY_LINE" | grep -q "@$VERSION"; then
            echo "Version verified: $VERSION"
          else
            echo "Error: Version Mismatch! Expected @$VERSION"
            exit 1
          fi
          
          if echo "$DEPLOY_LINE" | grep -q "$GITHUB_SHA"; then
            echo "Description verified: $GITHUB_SHA"
          else
            echo "Error: Description Mismatch! Expected $GITHUB_SHA"
            exit 1
          fi

          # Keep the historical admin URL in sync (non-critical, best-effort).
          # Some administrators may have bookmarked this deployment directly.
          # The canonical deployment (DEPLOYMENT_ID_ADMIN) is already verified above.
          LEGACY_ADMIN_DEPLOYMENT_ID=$(sed -n 's/^- \([^ ]*\) @[0-9][0-9]* - GALILEA_APPS_SCRIPT_ADMIN_URL$/\1/p' deployments.txt | head -1)
          if [ -n "$LEGACY_ADMIN_DEPLOYMENT_ID" ] && [ "$LEGACY_ADMIN_DEPLOYMENT_ID" != "$DEPLOYMENT_ID_ADMIN" ]; then
            echo "Synchronizing historical admin deployment to version $VERSION..."
            set +e
            clasp deploy -i "$LEGACY_ADMIN_DEPLOYMENT_ID" -V "$VERSION" -d "GALILEA_APPS_SCRIPT_ADMIN_URL"
            LEGACY_EXIT_CODE=$?
            set -e
            if [ $LEGACY_EXIT_CODE -eq 0 ]; then
              echo "Legacy deployment sync completed successfully (best-effort)."
            else
              echo "::warning::Legacy deployment sync failed with exit code $LEGACY_EXIT_CODE. This is non-fatal."
            fi
          else
            echo "No separate historical admin deployment requires synchronization."
          fi
          
          echo "═══════════════════════════════════════════"
          echo "PHASE B: Remote Source Parity Check..."
          echo "═══════════════════════════════════════════"
          
          # Pull remote source to temporary directory
          mkdir -p /tmp/clasp-pull-verify
          cp .clasp.json /tmp/clasp-pull-verify/.clasp.json
          # Adjust rootDir for pull target
          jq '.rootDir = "/tmp/clasp-pull-verify"' .clasp.json > /tmp/clasp-pull-verify/.clasp.json
          cd /tmp/clasp-pull-verify
          clasp pull
          
          echo "--- Remote files pulled ---"
          ls -la /tmp/clasp-pull-verify/
          
          REMOTE_FILE="/tmp/clasp-pull-verify/Admins.html"
          if [ ! -f "$REMOTE_FILE" ]; then
            echo "Error: Admins.html NOT FOUND in pulled source!"
            exit 1
          fi
          
          REMOTE_HASH=$(sha256sum "$REMOTE_FILE" | awk '{print $1}')
          REMOTE_SIZE=$(wc -c < "$REMOTE_FILE" | tr -d ' ')
          echo "Remote Admins.html SHA256: $REMOTE_HASH"
          echo "Remote Admins.html size: $REMOTE_SIZE bytes"
          
          # Key pattern checks on remote source
          echo "--- Key Pattern Checks on REMOTE source ---"
          grep -c "renderPhotoManager" "$REMOTE_FILE" | xargs -I{} echo "renderPhotoManager occurrences: {}"
          grep -c "initPhotoManagers" "$REMOTE_FILE" | xargs -I{} echo "initPhotoManagers occurrences: {}"
          grep -c "Belum ada foto" "$REMOTE_FILE" | xargs -I{} echo "Empty state text occurrences: {}"
          grep -c "GALILEA PHOTO MANAGER" "$REMOTE_FILE" | xargs -I{} echo "Diagnostic log occurrences: {}"
          grep -c "GALILEA INIT PHOTO" "$REMOTE_FILE" | xargs -I{} echo "Init diagnostic log occurrences: {}"
          grep -c "admin-build-commit" "$REMOTE_FILE" | xargs -I{} echo "Build marker occurrences: {}"
          
          # Check fixed selector
          if grep -q 'CSS.escape(key)+'"'"'"]'"'"')' "$REMOTE_FILE"; then
            echo "Selector fix: PRESENT (correct bracket closure)"
          else
            echo "Selector fix: MISSING or DIFFERENT"
          fi
          
          # Check PRIMARY logic
          if grep -q 'arr.find.*PRIMARY:' "$REMOTE_FILE"; then
            echo "PRIMARY find logic: PRESENT"
          else
            echo "PRIMARY find logic: MISSING"
          fi
          
          echo "═══════════════════════════════════════════"
          echo "PHASE B COMPLETE"
          echo "GitHub hash:  $GITHUB_HASH"
          echo "Remote hash:  $REMOTE_HASH"
          echo "GitHub size:  $GITHUB_SIZE"
          echo "Remote size:  $REMOTE_SIZE"
          if [ "$GITHUB_HASH" = "$REMOTE_HASH" ]; then
            echo "RESULT: IDENTICAL — remote source (@HEAD) matches GitHub exactly."
            echo "NOTE: clasp pull reads current project source, not the specific snapshot version."
          else
            echo "RESULT: MISMATCH — remote source (@HEAD) DIFFERS from GitHub!"
            echo "Running diff..."
            cd "$GITHUB_WORKSPACE"
            diff apps-script-backend/Admins.html "$REMOTE_FILE" | head -100 || true
          fi
          echo "═══════════════════════════════════════════"
        env:
          DEPLOYMENT_ID_ADMIN: ${{ secrets.DEPLOYMENT_ID_ADMIN }}

      - name: Push and Deploy Public API (USER_DEPLOYING)
        run: |
          if [ -z "$DEPLOYMENT_ID_API" ]; then
            echo "Error: DEPLOYMENT_ID_API secret is missing."
            exit 1
          fi
          
          # Modify manifest for API (USER_DEPLOYING, ANYONE_ANONYMOUS)
          jq '.webapp.executeAs = "USER_DEPLOYING" | .webapp.access = "ANYONE_ANONYMOUS"' apps-script-backend/appsscript.json > tmp.json && mv tmp.json apps-script-backend/appsscript.json
          
          echo "Pushing API Source..."
          clasp push --force
          
          echo "Creating API Version..."
          OUTPUT=$(clasp version "API: GitHub $GITHUB_SHA")
          VERSION=$(echo "$OUTPUT" | grep -o -E '[0-9]+' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to extract Apps Script version."
            exit 1
          fi
          
          echo "Deploying API to version $VERSION..."
          clasp deploy -i "$DEPLOYMENT_ID_API" -V "$VERSION" -d "API: GitHub $GITHUB_SHA"
        env:
          DEPLOYMENT_ID_API: ${{ secrets.DEPLOYMENT_ID_API }}
