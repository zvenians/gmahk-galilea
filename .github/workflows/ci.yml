name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Project & Contrast Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run project verification & contrast checks
        run: npm run check

  deploy:
    name: Apps Script Auto-Sync
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Authenticate Clasp
        run: |
          echo "Writing clasprc.json..."
          echo "$CLASPRC_JSON" | tr -d '\000' | grep -v '^$' > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Configure Clasp Target
        run: |
          echo "Writing .clasp.json..."
          echo "$CLASP_JSON" | tr -d '\000' | grep -v '^$' > .clasp.json
          chmod 600 .clasp.json
        env:
          CLASP_JSON: ${{ secrets.CLASP_JSON }}

      - name: Validate Apps Script Source
        run: |
          # Ensure critical files exist before pushing
          if [ ! -f apps-script-backend/Admin.gs ] || [ ! -f apps-script-backend/VercelApi.gs ] || [ ! -f apps-script-backend/appsscript.json ]; then
            echo "Error: Critical backend files are missing from apps-script-backend/"
            exit 1
          fi
          clasp status

      - name: Push and Deploy Admin Portal (USER_ACCESSING)
        run: |
          if [ -z "$DEPLOYMENT_ID_ADMIN" ]; then
            echo "Error: DEPLOYMENT_ID_ADMIN secret is missing."
            exit 1
          fi
          
          # Modify manifest for Admin (USER_ACCESSING)
          jq '.webapp.executeAs = "USER_ACCESSING" | .webapp.access = "ANYONE"' apps-script-backend/appsscript.json > tmp.json && mv tmp.json apps-script-backend/appsscript.json
          
          echo "Pushing Admin Source..."
          clasp push --force
          
          echo "Creating Admin Version..."
          OUTPUT=$(clasp version "Admin: GitHub $GITHUB_SHA")
          VERSION=$(echo "$OUTPUT" | grep -o -E '[0-9]+' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to extract Apps Script version."
            exit 1
          fi
          
          echo "Deploying Admin to version $VERSION..."
          clasp deploy -i "$DEPLOYMENT_ID_ADMIN" -V "$VERSION" -d "Admin: GitHub $GITHUB_SHA"
        env:
          DEPLOYMENT_ID_ADMIN: ${{ secrets.DEPLOYMENT_ID_ADMIN }}

      - name: Push and Deploy Public API (USER_DEPLOYING)
        run: |
          if [ -z "$DEPLOYMENT_ID_API" ]; then
            echo "Error: DEPLOYMENT_ID_API secret is missing."
            exit 1
          fi
          
          # Modify manifest for API (USER_DEPLOYING, ANYONE_ANONYMOUS)
          jq '.webapp.executeAs = "USER_DEPLOYING" | .webapp.access = "ANYONE_ANONYMOUS"' apps-script-backend/appsscript.json > tmp.json && mv tmp.json apps-script-backend/appsscript.json
          
          echo "Pushing API Source..."
          clasp push --force
          
          echo "Creating API Version..."
          OUTPUT=$(clasp version "API: GitHub $GITHUB_SHA")
          VERSION=$(echo "$OUTPUT" | grep -o -E '[0-9]+' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to extract Apps Script version."
            exit 1
          fi
          
          echo "Deploying API to version $VERSION..."
          clasp deploy -i "$DEPLOYMENT_ID_API" -V "$VERSION" -d "API: GitHub $GITHUB_SHA"
        env:
          DEPLOYMENT_ID_API: ${{ secrets.DEPLOYMENT_ID_API }}