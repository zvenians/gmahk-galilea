name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Project & Contrast Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run project verification & contrast checks
        run: npm run check

  deploy:
    name: Apps Script Auto-Sync
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate Clasp
        run: |
          if [ -z "${{ secrets.CLASPRC_JSON }}" ]; then
            echo "Error: CLASPRC_JSON secret is missing. Cannot authenticate clasp."
            exit 1
          fi
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Configure Clasp Target
        run: |
          if [ -z "${{ secrets.CLASP_JSON }}" ]; then
            echo "Error: CLASP_JSON secret is missing. Cannot target Apps Script project."
            exit 1
          fi
          echo '${{ secrets.CLASP_JSON }}' > .clasp.json
          
          # Force rootDir to apps-script-backend to prevent pushing unintended files (security)
          sudo apt-get install -y jq
          jq '.rootDir = "apps-script-backend"' .clasp.json > tmp.json && mv tmp.json .clasp.json
          
          cat << 'EOF' > .claspignore
          **/**
          !apps-script-backend/**/*.gs
          !apps-script-backend/**/*.html
          EOF

      - name: Validate Apps Script Source
        run: |
          clasp status
          # Ensure critical files exist before pushing
          if [ ! -f apps-script-backend/Admin.gs ] || [ ! -f apps-script-backend/VercelApi.gs ]; then
            echo "Error: Critical backend files are missing from apps-script-backend/"
            exit 1
          fi

      - name: Push to Apps Script
        run: clasp push --force

      - name: Version and Redeploy Existing Deployments
        run: |
          # Create immutable version
          OUTPUT=$(clasp version "GitHub ${{ github.sha }}")
          echo "$OUTPUT"
          
          # Extract the created version number
          VERSION=$(echo "$OUTPUT" | grep -o -E '[0-9]+' | tail -1)
          
          if [ -z "$VERSION" ]; then
            echo "Error: Failed to extract Apps Script version."
            exit 1
          fi
          
          echo "Extracted Apps Script Version: $VERSION"
          
          # Redeploy Admin Portal
          if [ -n "${{ secrets.DEPLOYMENT_ID_ADMIN }}" ]; then
            clasp deploy -i "${{ secrets.DEPLOYMENT_ID_ADMIN }}" -V "$VERSION" -d "Admin: GitHub ${{ github.sha }}"
            echo "✅ Admin Deployment Redeployed"
          else
            echo "⚠️ Warning: DEPLOYMENT_ID_ADMIN secret is missing."
          fi
          
          # Redeploy Public API
          if [ -n "${{ secrets.DEPLOYMENT_ID_API }}" ]; then
            clasp deploy -i "${{ secrets.DEPLOYMENT_ID_API }}" -V "$VERSION" -d "API: GitHub ${{ github.sha }}"
            echo "✅ API Deployment Redeployed"
          else
            echo "⚠️ Warning: DEPLOYMENT_ID_API secret is missing."
          fi