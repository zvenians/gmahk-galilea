    function legacyToHtml(text){
      if(!text)return'';
      if(/<[a-z][\s\S]*>/i.test(text))return text; // Already HTML
      return text.split(/\n{2,}/).map(p=>'<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>').join('');
    }
    function sanitizeHtml(html){
      if(!html)return'';
      const div=document.createElement('div');div.innerHTML=html;
      const allowedTags=['P','STRONG','B','EM','I','U','BR','UL','OL','LI','A','DIV','SPAN'];
      function clean(node){
        if(node.nodeType===3)return; // Text node
        if(node.nodeType!==1){node.remove();return;}
        if(!allowedTags.includes(node.nodeName)){
          while(node.firstChild)node.parentNode.insertBefore(node.firstChild,node);
          node.remove();return;
        }
        const attrs=node.attributes;
        for(let i=attrs.length-1;i>=0;i--){
          const name=attrs[i].name.toLowerCase(),val=attrs[i].value.toLowerCase();
          if(name==='href'){if(val.startsWith('javascript:'))node.removeAttribute(name);}
          else node.removeAttribute(name); // Strip all other attributes (class, style, etc)
        }
        Array.from(node.childNodes).forEach(clean);
      }
      Array.from(div.childNodes).forEach(clean);
      return div.innerHTML;
    }

          if(!btn)return;

          const cmd=btn.dataset.command;
          if(cmd==='createLink'){
            const url=prompt('Masukkan URL:','https://');
            if(url)document.execCommand(cmd,false,url);
          } else {
            document.execCommand(cmd,false,null);
          }
          editor.focus();
        });
      }
      editor.addEventListener('input',()=>textarea.value=sanitizeHtml(editor.innerHTML));
      editor.addEventListener('blur',()=>textarea.value=sanitizeHtml(editor.innerHTML));
    }

<script>
/* -------------------------------------------------------------------------- */
/* NEW MEDIA UPLOAD ENGINE (Resumable Upload)                                 */
/* -------------------------------------------------------------------------- */
const adminMediaRuntime = window.GALILEA_ADMIN_RUNTIME;
if (!adminMediaRuntime) throw new Error('Runtime admin media tidak tersedia.');
const $ = adminMediaRuntime.query;
const $$ = adminMediaRuntime.queryAll;
const esc = adminMediaRuntime.escapeText;
const attr = adminMediaRuntime.escapeAttribute;
const server = adminMediaRuntime.server;
const cleanError = adminMediaRuntime.cleanError;

const MEDIA_STATE = {
  QUEUED: 'QUEUED',
  INITIALIZING: 'INITIALIZING',
  UPLOADING: 'UPLOADING',
  FINALIZING: 'FINALIZING',
  DONE: 'DONE',
  ERROR: 'ERROR'
};

const activeUploads = new Map();
const localObjectUrls = new Set();

function revokeAllMediaUrls() {
  localObjectUrls.forEach(url => { try { URL.revokeObjectURL(url); } catch(e){} });
  localObjectUrls.clear();
}

function normalizeDriveUrl(url) {
  const value = String(url || '').trim();
  const match = value.match(/drive\.google\.com\/uc\?(?:[^#]*&)?id=([a-zA-Z0-9_-]+)/i)
    || value.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i)
    || value.match(/drive\.google\.com\/open\?(?:[^#]*&)?id=([a-zA-Z0-9_-]+)/i);
  return match ? 'https://lh3.googleusercontent.com/d/' + match[1] + '=w800' : value;
}

function parseMediaField(mediaValue, photosValue) {
  let media = [];
  try { media = mediaValue ? JSON.parse(mediaValue) : []; } catch(e){}
  if (!Array.isArray(media)) media = [];
  
  // Merge legacy photos if media is empty (backward compatibility)
  if (media.length === 0 && photosValue) {
    const urls = photosValue.split(/[\\n,;]+/).map(u => u.trim()).filter(Boolean);
    let cover = '';
    urls.forEach(u => { if(u.toUpperCase().startsWith('PRIMARY:')) cover = u.substring(8); });
    urls.forEach(u => {
      const clean = u.replace(/^PRIMARY:/i, '');
      if (clean) {
        media.push({
          id: '',
          name: 'Legacy Photo',
          mimeType: 'image/jpeg',
          size: 0,
          url: clean,
          primary: clean === cover,
          legacy: true
        });
      }
    });
  }
  return media;
}

function saveMediaField(targetKey, mediaArray) {
  const mediaInput = $('[name="'+CSS.escape(targetKey)+'"]');
  const photosInput = $('[name="photos"]'); // Hardcoded mapping back to photos for legacy
  
  if (mediaInput) mediaInput.value = JSON.stringify(mediaArray);
  if (photosInput) {
    const urls = mediaArray.map(m => (m.primary ? 'PRIMARY:' : '') + m.url);
    photosInput.value = urls.join('\n');
  }
}

function renderMediaManager(targetKey) {
  const container = $('#media-manager-' + CSS.escape(targetKey));
  const mediaInput = $('[name="'+CSS.escape(targetKey)+'"]');
  const photosInput = $('[name="photos"]');
  if (!container || !mediaInput) return;
  
  let media = parseMediaField(mediaInput.value, photosInput ? photosInput.value : '');
  
  container.innerHTML = media.map((m, idx) => {
    const isImage = m.mimeType.startsWith('image/');
    const isVideo = m.mimeType.startsWith('video/');
    const isAudio = m.mimeType.startsWith('audio/');
    
    let previewHtml = '';
    if (isImage) previewHtml = '<div class="media-thumb sq-64"><img src="'+attr(normalizeDriveUrl(m.url))+'" loading="lazy" onerror="this.outerHTML=\'<div class=\\\'media-thumb-broken\\\'>⚠️</div>\'"></div>';
    else if (isVideo) previewHtml = '<div class="media-thumb sq-64" style="background:#333;color:#fff;font-size:24px;">🎞️</div>';
    else if (isAudio) previewHtml = '<div class="media-thumb sq-64" style="background:#333;color:#fff;font-size:24px;">🎵</div>';
    else previewHtml = '<div class="media-thumb sq-64" style="font-size:24px;">📄</div>';

    const sizeKb = m.size ? Math.round(m.size/1024) + ' KB' : '';
    
    return '<div class="upload-item success" style="justify-content:flex-start; margin-bottom: 8px; position:relative">' + 
      previewHtml + 
      '<div class="upload-info"><span class="upload-name">'+esc(m.name)+'</span>' +
      (sizeKb ? '<span class="upload-size">'+sizeKb+'</span>' : '') +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
      (isImage ? '<button type="button" class="btn small soft" onclick="setPrimaryMedia(\''+attr(targetKey)+'\', '+idx+')">'+(m.primary?'★ FOTO UTAMA':'Jadikan Utama')+'</button>' : '') +
      '<button type="button" class="btn small soft error-text" onclick="removeMedia(\''+attr(targetKey)+'\', '+idx+')">Hapus</button>' +
      '</div></div>';
  }).join('');
}

window.setPrimaryMedia = function(targetKey, index) {
  const mediaInput = $('[name="'+CSS.escape(targetKey)+'"]');
  const photosInput = $('[name="photos"]');
  let media = parseMediaField(mediaInput.value, photosInput ? photosInput.value : '');
  media.forEach((m, i) => m.primary = (i === index));
  saveMediaField(targetKey, media);
  renderMediaManager(targetKey);
};

window.removeMedia = function(targetKey, index) {
  if (!confirm('Hapus media ini?')) return;
  const mediaInput = $('[name="'+CSS.escape(targetKey)+'"]');
  const photosInput = $('[name="photos"]');
  let media = parseMediaField(mediaInput.value, photosInput ? photosInput.value : '');
  media.splice(index, 1);
  saveMediaField(targetKey, media);
  renderMediaManager(targetKey);
};

// uploadMediaEngine.js replacement
window.mediaUploadStates = window.mediaUploadStates || {};

async function uploadMediaFile(file, targetKey) {
  const uploadId = 'up-' + Date.now() + '-' + Math.random().toString(36).substr(2,9);
  window.mediaUploadStates[uploadId] = 'INITIALIZING';
  
  const isImage = file.type.startsWith('image/');
  const isVideo = file.type.startsWith('video/');
  const isAudio = file.type.startsWith('audio/');
  
  let thumbUrl = '';
  try { 
    thumbUrl = URL.createObjectURL(file); 
    localObjectUrls.add(thumbUrl);
  } catch (e) {}

  let previewHtml = '';
  if (isImage && thumbUrl) previewHtml = '<div class="media-thumb sq-64"><img src="'+attr(thumbUrl)+'" loading="lazy" onerror="this.outerHTML=\'<div class=\\\'media-thumb-broken\\\'>⚠️</div>\'"></div>';
  else if (isVideo && thumbUrl) previewHtml = '<video src="'+attr(thumbUrl)+'" class="media-thumb sq-64" preload="metadata"></video>';
  else if (isAudio) previewHtml = '<div class="media-thumb sq-64" style="background:#333;color:#fff;font-size:24px;">🎵</div>';
  else previewHtml = '<div class="media-thumb sq-64" style="font-size:24px;">📄</div>';

  const container = $('#media-manager-' + CSS.escape(targetKey));
  const el = document.createElement('div');
  el.id = uploadId;
  el.className = 'upload-item pending';
  el.style.justifyContent = 'flex-start';
  el.style.marginBottom = '8px';
  el.style.position = 'relative';
  
  el.innerHTML = previewHtml + 
    '<div class="upload-info"><span class="upload-name">'+esc(file.name)+'</span><span class="upload-size">'+Math.round(file.size/1024)+' KB</span>' +
    '<div class="progress-bar-bg" style="width:100%;height:4px;background:#ddd;margin-top:4px;border-radius:2px;overflow:hidden"><div class="progress-bar-fill" style="width:0%;height:100%;background:var(--accent);transition:width 0.2s"></div></div>' +
    '</div><div class="upload-status" style="margin-left:12px;font-size:12px">Menyiapkan...</div>';
  
  container.appendChild(el);
  
  const statusEl = el.querySelector('.upload-status');
  const progressFill = el.querySelector('.progress-bar-fill');

  try {
    window.mediaUploadStates[uploadId] = 'INITIALIZING';
    statusEl.textContent = 'Inisialisasi...';
    
    let sessionUrl = '';
    const initSession = async () => {
      const initRes = await server('adminCreateMediaUploadSession', [{ name: file.name, mimeType: file.type || 'application/octet-stream', size: file.size }], 30000);
      if (!initRes || !initRes.sessionUrl) throw new Error('Gagal mendapatkan session URL.');
      sessionUrl = initRes.sessionUrl;
    };
    await initSession();
    
    window.mediaUploadStates[uploadId] = 'UPLOADING';
    statusEl.textContent = 'Mengunggah...';
    
    const CHUNK_SIZE = 16 * 1024 * 1024;
    let offset = 0;
    let driveFileId = '';
    
    while (offset < file.size) {
      window.mediaUploadStates[uploadId] = 'UPLOADING';
      const end = Math.min(offset + CHUNK_SIZE, file.size);
      const chunk = file.slice(offset, end);
      
      let attempts = 0;
      let chunkSuccess = false;
      
      while (attempts < 4 && !chunkSuccess) {
        attempts++;
        try {
          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', sessionUrl, true);
            xhr.setRequestHeader('Content-Range', 'bytes ' + offset + '-' + (end - 1) + '/' + file.size);
            
            xhr.upload.onprogress = (e) => {
              if (e.lengthComputable) {
                const percent = Math.round(((offset + e.loaded) / file.size) * 100);
                progressFill.style.width = percent + '%';
                statusEl.textContent = percent + '%';
              }
            };
            
            xhr.onload = () => {
              if (xhr.status === 200 || xhr.status === 201) { 
                chunkSuccess = true; 
                try {
                  const resData = JSON.parse(xhr.responseText);
                  if (resData.id) driveFileId = resData.id;
                } catch(e) {}
                resolve(); 
              }
              else if (xhr.status === 308) {
                chunkSuccess = true;
                const range = xhr.getResponseHeader('Range');
                if (range) {
                  const match = range.match(/bytes=0-(\d+)/);
                  if (match) offset = parseInt(match[1], 10) + 1;
                } else {
                  // If no Range header on 308, assume no bytes were saved.
                }
                resolve(); 
              }
              else if (xhr.status === 404) {
                // Session expired.
                reject(new Error('HTTP 404 Session Expired'));
              }
              else { reject(new Error('HTTP ' + xhr.status)); }
            };
            xhr.onerror = () => reject(new Error('Network Error'));
            xhr.send(chunk);
          });
        } catch(err) {
          window.mediaUploadStates[uploadId] = 'RETRYING';
          statusEl.textContent = 'Retry... (' + attempts + ')';
          
          if (err.message.includes('HTTP 404')) {
            // Session expired, restart completely
            await initSession();
            offset = 0;
            attempts = 0;
            continue;
          }
          
          if (attempts >= 4) throw new Error('Gagal unggah chunk setelah 4 kali coba: ' + err.message);
          await new Promise(r => setTimeout(r, Math.pow(2, attempts) * 1000));
          
          // Query status before retrying to prevent duplicate bytes
          try {
            await new Promise((res, rej) => {
              const qxhr = new XMLHttpRequest();
              qxhr.open('PUT', sessionUrl, true);
              qxhr.setRequestHeader('Content-Range', 'bytes */' + file.size);
              qxhr.onload = () => {
                if (qxhr.status === 200 || qxhr.status === 201) {
                  chunkSuccess = true;
                  try {
                    const resData = JSON.parse(qxhr.responseText);
                    if (resData.id) driveFileId = resData.id;
                  } catch(e) {}
                  res();
                } else if (qxhr.status === 308) {
                  const range = qxhr.getResponseHeader('Range');
                  if (range) {
                    const match = range.match(/bytes=0-(\d+)/);
                    if (match) offset = parseInt(match[1], 10) + 1;
                  }
                  chunkSuccess = true; // Break inner loop to reslice chunk
                  res(); //, let the loop retry at new offset
                } else if (qxhr.status === 404) {
                  rej(new Error('HTTP 404 Session Expired'));
                } else {
                  res(); // Ignore other errors, retry the chunk
                }
              };
              qxhr.onerror = () => res(); // Ignore network errors on status query, let loop retry
              qxhr.send();
            });
          } catch (qerr) {
            if (qerr.message.includes('HTTP 404')) {
              await initSession();
              offset = 0;
              attempts = 0;
            }
          }
        }
      }
      if (!chunkSuccess) {
        // Did we advance via status query? If not, we fail.
        if (offset >= file.size) break;
        // The loop will just continue from the new offset if we got 308 from status query!
      }
      if (driveFileId) break; // Reached 200/201!
    }
    
    if (!driveFileId) throw new Error('Tidak mendapatkan ID file dari Google Drive.');
    
    window.mediaUploadStates[uploadId] = 'FINALIZING';
    statusEl.textContent = 'Finalisasi...';
    const finalRes = await server('adminFinalizeMediaUpload', [{ fileId: driveFileId }], 30000);
    
    window.mediaUploadStates[uploadId] = 'DONE';
    el.className = 'upload-item success';
    statusEl.textContent = 'Berhasil';
    progressFill.style.width = '100%';
    progressFill.style.background = 'var(--success)';
    
    return {
      id: finalRes.id,
      name: finalRes.name,
      mimeType: finalRes.mimeType,
      size: finalRes.size,
      url: isImage ? normalizeDriveUrl(finalRes.url) : finalRes.url,
      viewUrl: finalRes.viewUrl,
      downloadUrl: finalRes.downloadUrl,
      primary: false
    };
    
  } catch(err) {
    window.mediaUploadStates[uploadId] = 'ERROR';
    el.className = 'upload-item error';
    statusEl.textContent = 'Gagal: ' + cleanError(err.message);
    progressFill.style.background = 'var(--danger)';
    return null;
  }
}

        '<div style="font-size:11px;color:var(--faint);margin-bottom:4px">'+(file.size/1024/1024).toFixed(2)+' MB</div>'+
        '<div class="progress-bar-bg" style="width:100%;height:5px;background:var(--line);border-radius:3px;overflow:hidden"><div class="progress-bar-fill" style="width:0%;height:100%;background:var(--accent);transition:width 0.2s"></div></div>'+
      '</div>'+
      '<div class="upload-status" style="margin-left:12px;font-size:11px;font-weight:600;min-width:64px;text-align:right;flex-shrink:0">Menyiapkan...</div>';
    if (isMultiple) {

    } else {
      previewList.innerHTML = '';
      previewList.appendChild(li);
    }
    const statusEl = li.querySelector('.upload-status');
    const progressFill = li.querySelector('.progress-bar-fill');
    
    (async () => {
      try {
        statusEl.textContent = 'Menyiapkan...';
        let sessionUrl = '';
        const initRes = await server('adminCreateMediaUploadSession', [{ name: file.name, mimeType: file.type || 'application/octet-stream', size: file.size }], 30000);

        statusEl.textContent = 'Mengunggah...';
        const CHUNK_SIZE = 8 * 1024 * 1024;
        const MAX_STALL_COUNT = 5;
        const MAX_SESSION_RECOVERY = 3;
        const MAX_STATUS_QUERY = 10;
        const MAX_RETRIES = 4;
        
        let offset = 0; 
        let driveFileId = '';
        let stallCount = 0;
        let recoveryCount = 0;
        let globalQueryCount = 0;

        const queryUploadStatus = async (url, size) => {
          if (globalQueryCount >= MAX_STATUS_QUERY) {
            throw new Error('FATAL: Upload dihentikan karena osilasi / terlalu banyak status query.');
          }
          globalQueryCount++;
          
          return new Promise((resolve, reject) => {
            const q = new XMLHttpRequest();
            q.open('PUT', url, true);
            q.setRequestHeader('Content-Range', 'bytes */' + size);
            q.timeout = 30000;
            
            q.onload = () => {
              if (q.status === 200 || q.status === 201) {
                try {
                  const res = JSON.parse(q.responseText);
                  if (res.id) resolve({ status: 'completed', fileId: res.id });
                  else reject(new Error('Invalid response JSON'));
                } catch(e) { reject(new Error('Invalid response JSON')); }
              } else if (q.status === 308) {
                const r = q.getResponseHeader('Range');
                if (r) {
                  const m = r.match(/^bytes=0-(\d+)$/);
                  if (m) {
                    const n = parseInt(m[1], 10);
                    if (!isNaN(n) && n >= 0 && n < size) {
                      resolve({ status: 'incomplete', nextOffset: n + 1 });
                      return;
                    }
                  }
                  reject(new Error('Malformed Range pada status query'));
                } else {
                  resolve({ status: 'incomplete', nextOffset: 0 }); 
                }
              } else if (q.status === 404) {
                resolve({ status: 'session_expired' });
              } else {
                reject(new Error('Status query gagal: HTTP ' + q.status));
              }
            };
            
            q.ontimeout = () => reject(new Error('Status query timeout'));
            q.onerror = () => reject(new Error('Network error saat query status'));
            q.send(null);
          });
        };

        while (offset < file.size) {
          const end = Math.min(offset + CHUNK_SIZE, file.size);
          const chunk = file.slice(offset, end);
          let attempts = 0;
          let chunkSuccess = false;
          let serverConfirmedOffset = offset;
          
          while (attempts < MAX_RETRIES && !chunkSuccess) {
            attempts++;
            try {
              let queryNeeded = false;
              await new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('PUT', sessionUrl, true);
                xhr.setRequestHeader('Content-Range', 'bytes ' + offset + '-' + (end - 1) + '/' + file.size);
                xhr.timeout = 60000;
                
                xhr.upload.onprogress = (e) => {
                  if (e.lengthComputable) {
                    const localPercent = Math.round(((offset + e.loaded) / file.size) * 100);
                    progressFill.style.width = localPercent + '%';
                    statusEl.textContent = localPercent + '%';
                  }
                };
                
                xhr.onload = () => {
                  if (xhr.status === 200 || xhr.status === 201) { 
                    chunkSuccess = true; 
                    try {
                      const resData = JSON.parse(xhr.responseText);
                      if (resData.id) driveFileId = resData.id;
                    } catch(e) {}
                    resolve(); 
                  } else if (xhr.status === 308) {
                    const range = xhr.getResponseHeader('Range');
                    let validRange = false;
                    if (range) {
                      const match = range.match(/^bytes=0-(\d+)$/);
                      if (match) {
                        const n = parseInt(match[1], 10);
                        if (!isNaN(n) && n >= 0 && n < file.size) {
                          const proposedNext = n + 1;
                          if (proposedNext >= offset && proposedNext <= end) { 
                            serverConfirmedOffset = proposedNext;
                            chunkSuccess = true;
                            validRange = true;
                          } else {
                            console.log('INCONSISTENT RANGE', 'localOffset:', offset, 'chunkEnd:', end, 'responseRange:', range, 'proposedNext:', proposedNext, 'action: STATUS_QUERY');
                          }
                        }
                      }
                    }
                    if (!validRange) queryNeeded = true;
                    resolve();
                  } else if (xhr.status === 404) {
                    reject(new Error('RESTART_SESSION: HTTP 404 Session Expired'));
                  } else if (xhr.status === 429 || (xhr.status === 403 && (xhr.responseText.includes('rateLimitExceeded') || xhr.responseText.includes('userRateLimitExceeded')))) {
                    queryNeeded = true; 
                    resolve();
                  } else if (xhr.status === 403) {
                    reject(new Error('FATAL: HTTP 403 Forbidden'));
                  } else if (xhr.status >= 400 && xhr.status < 500) {
                    reject(new Error('RESTART_SESSION: HTTP ' + xhr.status));
                  } else if (xhr.status >= 500 && xhr.status < 600) {
                    queryNeeded = true;
                    resolve();
                  } else {
                    reject(new Error('FATAL: HTTP ' + xhr.status + ' Upload Ditolak Google Drive'));
                  }
                };
                
                xhr.ontimeout = () => { queryNeeded = true; resolve(); };
                xhr.onerror = () => { queryNeeded = true; resolve(); }; 
                xhr.send(chunk);
              });
              
              if (queryNeeded) {
                const qs = await queryUploadStatus(sessionUrl, file.size);
                if (qs.status === 'completed') {
                  chunkSuccess = true;
                  driveFileId = qs.fileId;
                } else if (qs.status === 'incomplete') {
                  chunkSuccess = true;
                  serverConfirmedOffset = qs.nextOffset; 
                } else if (qs.status === 'session_expired') {
                  throw new Error('RESTART_SESSION: HTTP 404 Session Expired dari Query');
                }
              }
              
              if (chunkSuccess && !driveFileId) {
                 if (serverConfirmedOffset < offset) {
                     stallCount = 0; 
                 } else if (serverConfirmedOffset === offset) {
                     stallCount++;
                     if (stallCount >= MAX_STALL_COUNT) {
                         throw new Error('FATAL: Upload tidak menunjukkan progres setelah beberapa kali pemeriksaan.');
                     }
                 } else {
                     stallCount = 0; 
                 }
                 offset = serverConfirmedOffset; 
              }
              
            } catch(err) {
              statusEl.textContent = 'Retry ' + attempts;
              
              if (err.message.includes('FATAL')) {
                throw err;
              }
              
              if (err.message.includes('RESTART_SESSION')) {
                recoveryCount++;
                if (recoveryCount >= MAX_SESSION_RECOVERY) {
                    throw new Error('FATAL: Upload dihentikan setelah beberapa kali session recovery.');
                }
                const initRes2 = await server('adminCreateMediaUploadSession', [{ name: file.name, mimeType: file.type || 'application/octet-stream', size: file.size }], 30000);
                if (!initRes2 || !initRes2.sessionUrl) throw new Error('FATAL: Gagal mendapatkan session URL baru.');
                sessionUrl = initRes2.sessionUrl;
                offset = 0; 
                attempts = 0; 
                continue;
              }
              
              if (attempts >= MAX_RETRIES) throw new Error('FATAL: ' + err.message);
              await new Promise(r => setTimeout(r, Math.pow(2, attempts) * 1000));
            }
          }
          if (!chunkSuccess && offset >= file.size) break;
          if (driveFileId) break;
        }
        
        if (!driveFileId) throw new Error('Gagal mendapatkan ID Drive.');
        
        statusEl.textContent = 'Menyimpan...';
        const finalRes = await server('adminFinalizeMediaUpload', [{ fileId: driveFileId }], 30000);
        
        li.className = 'upload-item success';
        statusEl.textContent = 'Berhasil';
        statusEl.style.color = 'var(--accent)';
        progressFill.style.width = '100%';
        progressFill.style.background = 'var(--accent)';
        
        if (isMultiple) {
          // Append URL (primary only if first)
          let urls = urlInput.value.split(/\n/).map(u=>u.trim()).filter(Boolean);
          const hasPrimary = urls.some(u => u.toUpperCase().startsWith('PRIMARY:'));
          if (!hasPrimary) {
            urls.push('PRIMARY:' + normalizeDriveUrl(finalRes.url));
          } else {
            urls.push(normalizeDriveUrl(finalRes.url));
          }
          urlInput.value = urls.join('\n');
          // Remove pending item and refresh photo grid
          li.remove();
          if (typeof renderPhotoManager === 'function') renderPhotoManager(targetKey);
        } else {
          urlInput.value = normalizeDriveUrl(finalRes.url);
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'btn small soft error-text';
          removeBtn.textContent = 'Hapus';
          removeBtn.style.marginTop = '8px';
          removeBtn.onclick = () => { urlInput.value = ''; previewList.innerHTML = ''; };
          li.querySelector('.upload-info').appendChild(removeBtn);
        }
        
      } catch(err) {
        li.className = 'upload-item error';
        statusEl.textContent = 'Gagal';
        statusEl.style.color = 'var(--danger)';
        progressFill.style.background = 'var(--danger)';
        
        const errorDetail = document.createElement('div');
        errorDetail.style.color = 'var(--danger)';
        errorDetail.style.fontSize = '11px';
        errorDetail.style.marginTop = '4px';
        errorDetail.textContent = typeof cleanError === 'function' ? cleanError(err.message) : err.message;
        
        li.querySelector('.upload-info').appendChild(errorDetail);
      }
    })();
  }
};

window.uploadMediaEngine = async function(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  const targetKey = input.dataset.mediaTarget;
  input.value = '';
  for (const file of files) {
    const p = uploadMediaFile(file, targetKey);
    p.then((mediaObj) => {
      if (mediaObj) {
        const mediaInput = $('[name="'+CSS.escape(targetKey)+'"]');
        const photosInput = $('[name="photos"]');
        let mediaArr = parseMediaField(mediaInput.value, photosInput ? photosInput.value : '');
        mediaArr.push(mediaObj);
        saveMediaField(targetKey, mediaArr);
        
        // Only render if all uploads for this target are DONE or ERROR
        const hasActiveUploads = Object.values(window.mediaUploadStates).some(state => state && state !== 'DONE' && state !== 'ERROR');
        if (!hasActiveUploads) {
          renderMediaManager(targetKey);
        }
      }
    });
  }
};
;
</script>
