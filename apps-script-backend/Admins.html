    function legacyToHtml(text){
      if(!text)return'';
      if(/<[a-z][\s\S]*>/i.test(text))return text; // Already HTML
      return text.split(/\n{2,}/).map(p=>'<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>').join('');
    }
    function sanitizeHtml(html){
      if(!html)return'';
      const div=document.createElement('div');div.innerHTML=html;
      const allowedTags=['P','STRONG','B','EM','I','U','BR','UL','OL','LI','A','DIV','SPAN'];
      function clean(node){
        if(node.nodeType===3)return; // Text node
        if(node.nodeType!==1){node.remove();return;}
        if(!allowedTags.includes(node.nodeName)){
          while(node.firstChild)node.parentNode.insertBefore(node.firstChild,node);
          node.remove();return;
        }
        const attrs=node.attributes;
        for(let i=attrs.length-1;i>=0;i--){
          const name=attrs[i].name.toLowerCase(),val=attrs[i].value.toLowerCase();
          if(name==='href'){if(val.startsWith('javascript:'))node.removeAttribute(name);}
          else node.removeAttribute(name); // Strip all other attributes (class, style, etc)
        }
        Array.from(node.childNodes).forEach(clean);
      }
      Array.from(div.childNodes).forEach(clean);
      return div.innerHTML;
    }

        function normalizeDriveUrl(url) {
      const match = url.match(/drive\.google\.com\/uc\?export=view&id=([^&]+)/);
      if (match) return 'https://lh3.googleusercontent.com/d/' + match[1] + '=w800';
      return url;
    }

    async function uploadImage(input){
      const files=Array.from(input.files||[]);if(!files.length)return;
      if(files.length>12)return toast('Maksimal 12 foto dalam satu unggahan.');
      if(files.some(file=>file.size>4*1024*1024))return toast('Setiap gambar maksimal 4 MB.');
      const target=input.dataset.imageTarget,append=input.dataset.imageMode==='append';
      const field=$('[name="'+CSS.escape(target)+'"]',$('#editor-form'));
      const previewList=$('#upload-preview-'+CSS.escape(target));
      const uploaded=[];
      $$('dialog[open] button[type="submit"], dialog[open] button[value="draft"], dialog[open] button[value="submit"]').forEach(b => { b.disabled = true; b.dataset.uploading = '1'; });
      
      try {
        if(previewList && !append) previewList.innerHTML = '';
        
        for(let index=0;index<files.length;index++){
          const file=files[index];
          const kb = Math.round(file.size/1024);
          const liId = 'upload-item-' + target + '-' + index + '-' + Date.now();
          let thumbUrl = '';
          try { thumbUrl = URL.createObjectURL(file); } catch (e) {}
          const imgHtml = thumbUrl ? '<img src="'+attr(thumbUrl)+'" style="width:48px;height:48px;object-fit:cover;border-radius:6px;flex:0 0 auto;margin-right:12px">' : '';
          
          if(previewList) {
            previewList.insertAdjacentHTML('beforeend', '<li id="'+liId+'" class="upload-item pending" style="justify-content:flex-start">'+imgHtml+'<div class="upload-info" style="flex:1"><span class="upload-name">'+esc(file.name)+'</span><span class="upload-size">'+kb+' KB</span></div><div class="upload-status">Mengunggah...</div></li>');
          }
          
          try {
            const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});
            const result=await server('adminUploadImage',[{name:file.name,mimeType:file.type,base64:base64}],30000);
            if(result&&result.url) {
              uploaded.push(normalizeDriveUrl(result.url));
              if(previewList) {
                const li = $('#'+liId);
                if(li) { li.className = 'upload-item success'; li.querySelector('.upload-status').textContent = 'Berhasil'; }
              }
            }
          } catch(err) {
            if(previewList) {
              const li = $('#'+liId);
              if(li) { li.className = 'upload-item error'; li.querySelector('.upload-status').textContent = 'Gagal: ' + cleanError(err.message); }
            }
          }
        }
        
        if(field&&uploaded.length){
          const existing=append?String(field.value||'').split(/\n+/).map(value=>value.trim()).filter(Boolean):[];
          field.value=existing.concat(uploaded).slice(0,12).join('\n');
          field.dispatchEvent(new Event('change',{bubbles:true}));
          if(typeof renderPhotoManager === 'function') renderPhotoManager(field.name);
        }
        if(uploaded.length) toast(uploaded.length+' foto berhasil ditambahkan.');
      } catch(error){
        toast(cleanError(error.message));
      } finally {
        input.value='';
        $$('dialog[open] button[data-uploading]').forEach(b => { b.disabled = false; delete b.dataset.uploading; });
      }
    }

    function openReview(id){const item=(state.approvals||[]).find(x=>x.id===id);if(!item)return toast('Pengajuan ini sudah diproses. Muat ulang daftar.');state.currentReview=item;state.reviewMode='';$('#review-caption').textContent='Periksa isi sebelum mengambil keputusan';const isDelete=item.action==='DELETE';const warningHtml=isDelete?'<div class="editor-validation-row warning" style="margin-top:16px;color:var(--danger);border-color:var(--danger)">'+icon('trash')+'<strong>Konten ini akan dihapus permanen setelah disetujui.</strong></div>':'';$('#review-body').innerHTML=workflowGuide('REVIEW')+'<div class="approval-meta">'+status(item.state)+'<span>'+esc(friendlyEntity(item.entity))+'</span><span>'+esc(item.ownerName)+'</span></div><h2 class="review-title">'+esc(isDelete?'Konfirmasi penghapusan':'Periksa sebelum diterbitkan')+'</h2>'+payloadHtml(item.payload)+warningHtml+'<section class="review-reason" id="review-reason" aria-hidden="true"><div class="reason-head">'+icon('edit')+'<div><strong>Alasan revisi</strong><span>Jelaskan bagian yang harus diperbaiki. Catatan ini langsung terlihat oleh editor.</span></div></div><textarea id="review-note" minlength="4" placeholder="Contoh: Perbaiki tanggal kegiatan dan tambahkan lokasi yang lengkap."></textarea><span class="reason-help" id="reason-help">Minimal 4 karakter.</span></section>';const reject=$('[data-review="REJECT"]');reject.innerHTML='Minta revisi';reject.classList.remove('primary');reject.classList.add('danger');const approve=$('[data-review="APPROVE"]');if(isDelete){approve.innerHTML=icon('trash')+'Setujui Penghapusan';approve.classList.remove('primary');approve.classList.add('danger');}else{approve.innerHTML=icon('check')+'Setujui & Terbitkan';approve.classList.remove('danger');approve.classList.add('primary');}$('#review-dialog').showModal()}
    async function review(decision){if(!state.currentReview)return;const reason=$('#review-reason'),note=$('#review-note')?$('#review-note').value.trim():'';if(decision==='REJECT'&&state.reviewMode!=='reject'){state.reviewMode='reject';reason.classList.add('show');reason.setAttribute('aria-hidden','false');$('#review-caption').textContent='Tuliskan alasan revisi sebelum dikirim';const reject=$('[data-review="REJECT"]');reject.innerHTML=icon('send')+'Kirim untuk revisi';reject.classList.remove('danger');reject.classList.add('primary');requestAnimationFrame(()=>{$('#review-note').focus();reason.scrollIntoView({behavior:'smooth',block:'nearest'})});return}if(decision==='REJECT'&&note.length<4){$('#review-note').focus();$('#reason-help').classList.add('error');return}const buttons=$$('[data-review]'),button=$('[data-review="'+decision+'"]'),reviewed=state.currentReview;buttons.forEach(b=>b.disabled=true);setBusy(button,true,decision==='REJECT'?'Mengirim revisi…':'Menerbitkan…');try{const result=await server('adminReviewWorkflow',[reviewed.id,decision,note],30000);$('#review-dialog').close();toast(result.message);if(state.boot&&state.boot.dashboard)state.boot.dashboard.pendingApprovals=Math.max(0,Number(state.boot.dashboard.pendingApprovals||0)-1);state.approvalCache.PENDING={time:Date.now(),items:(state.approvalCache.PENDING&&state.approvalCache.PENDING.items||state.approvals).filter(item=>item.id!==reviewed.id)};const target=decision==='APPROVE'?'APPROVED':'REJECTED';const moved=Object.assign({},reviewed,{state:result.state,note:note,reviewerEmail:state.boot.user.email,reviewedAt:'Baru saja'});const existing=state.approvalCache[target]&&state.approvalCache[target].items||[];state.approvalCache[target]={time:Date.now(),items:[moved].concat(existing.filter(item=>item.id!==moved.id))};state.currentReview=null;state.reviewMode='';await loadApprovals(target,false)}catch(error){toast(cleanError(error.message))}finally{buttons.forEach(b=>b.disabled=false);setBusy(button,false     async function deleteUser(id,button){if(!confirm('Hapus pengelola ini dari portal?'))return;setBusy(button,true);try{await server('adminDeleteUser',[id]);toast('Pengelola dihapus.');await loadUsers()}catch(error){toast(cleanError(error.message))}finally{setBusy(button,false)}}

    function renderSystem(){const canBackup=state.boot.user.permissions.backup;$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">SYSTEM OPERATIONS</span><h1>Sistem, arsip & backup</h1><p>Perawatan website dilakukan tanpa mengubah isi sumber API.</p></div><span class="status publish">V'+esc(state.boot.version)+'</span></div><div class="grid grid-4"><article class="card card-pad"><span class="metric-icon">'+icon('refresh')+'</span><h3 style="margin-top:24px">Perbarui Cache</h3><p class="muted">Paksa viewer membaca perubahan spreadsheet terbaru.</p><button class="btn primary" data-system="refresh">Jalankan sekarang</button></article><article class="card card-pad"><span class="metric-icon">'+icon('check')+'</span><h3 style="margin-top:24px">Pemeriksaan Sumber</h3><p class="muted">Periksa materi, video, Alkitab, dan layanan.</p><button class="btn" data-system="health">Periksa sistem</button></article><article class="card card-pad"><span class="metric-icon">'+icon('download')+'</span><h3 style="margin-top:24px">Arsip PDF Publik</h3><p class="muted">Bangun ulang PDF Alkitab dan Lagu Sion lengkap untuk viewer.</p><button class="btn" data-system="archives" '+(canBackup?'':'disabled')+'>Bangun arsip</button></article><article class="card card-pad"><span class="metric-icon">'+icon('download')+'</span><h3 style="margin-top:24px">Backup Data</h3><p class="muted">Buat salinan spreadsheet dan layanan jemaat di Drive.</p><button class="btn" data-system="backup" '+(canBackup?'':'disabled')+'>Buat backup</button></article></div><div id="system-result" style="margin-top:20px"></div><article class="card card-pad" style="margin-top:22px"><span class="eyebrow">KEAMANAN DEPLOYMENT</span><h3>Portal admin memakai deployment khusus.</h3><p class="muted">Buka alamat Vercel <strong>/admin</strong>. Vercel akan meneruskan Anda ke deployment admin yang berjalan sebagai <strong>User accessing the web app</strong> sehingga email Google dapat diverifikasi.</p></article>'}
    async function runSystem(action,button){const label=action==='backup'?'Membuat backup…':action==='archives'?'Menyusun PDF lengkap…':'Memproses…';setBusy(button,true,label);try{const result=await server('adminRunSystemAction',[action],action==='archives'?110000:22000);$('#system-result').innerHTML='<article class="card card-pad"><span class="status approved">BERHASIL</span><pre style="white-space:pre-wrap;color:var(--soft);overflow-wrap:anywhere">'+esc(typeof result==='string'?result:JSON.stringify(result,null,2))+'</pre></article>';toast(action==='archives'?'Arsip PDF siap digunakan di viewer.':'Aksi sistem selesai.')}catch(error){$('#system-result').innerHTML=errorBox(error.message)}finally{setBusy(button,false)}}

    function emptyHtml(message){return '<div class="empty">'+icon('info')+'<p>'+esc(message)+'</p></div>'}
    async function refreshBootstrap(){state.boot=await server('adminGetBootstrap',[],30000);$('#root').innerHTML=shell();bindShell();applyTheme(currentTheme());$$('.nav-item').forEach(button=>button.classList.toggle('active',button.dataset.route===state.route));const crumb=$('#crumb-title');if(crumb)crumb.textContent=routeTitle();loadDashboardSummary(false)}
    function showGate(error){
      const raw=String(error&&error.message||'Terjadi gangguan saat membuka portal.');
      const access=/^(?:LOGIN_REQUIRED|ADMIN_NOT_READY|ACCESS_DENIED|FORBIDDEN)\|/.test(raw);
      const message=cleanError(raw);
      const title=access?'Akses admin diperlukan.':'Portal belum dapat dimuat.';
      const eyebrow=access?'VERIFIKASI AKUN':'PEMULIHAN SISTEM';
      const steps=access
        ? '<div class="step"><b>1</b><span>Gunakan deployment admin yang dijalankan sebagai <strong>User accessing the web app</strong>.</span></div><div class="step"><b>2</b><span>Pastikan email Google tercantum dan berstatus <strong>AKTIF</strong> pada sheet <strong>Website Admin</strong>.</span></div><div class="step"><b>3</b><span>Buka alamat Vercel dengan akhiran <strong>/admin</strong>, lalu masuk memakai akun tersebut.</span></div>'
        : '<div class="step"><b>1</b><span>Akun Google Anda sudah dikenali; ini adalah gangguan kode atau data, bukan masalah login.</span></div><div class="step"><b>2</b><span>Pastikan deployment admin memakai versi terbaru, bukan versi lama.</span></div><div class="step"><b>3</b><span>Muat ulang setelah deployment selesai diperbarui.</span></div>';
      $('#loader').classList.add('hidden');
      $('#root').innerHTML='<main class="gate"><article class="gate-card">'+logoMark('gate-logo')+'<span class="eyebrow">'+eyebrow+'</span><h1>'+title+'</h1><p class="muted gate-message">'+esc(message)+'</p><div class="steps">'+steps+'</div><button class="btn primary" onclick="location.reload()">Muat ulang portal</button></article></main>';
    }
    function bindShell(){
      $('#mobile-menu')?.addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('open')});
      $('#overlay')?.addEventListener('click',closeSidebar);
      $('#theme-toggle')?.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
      $('#notif-toggle')?.addEventListener('click',(e)=>{
        e.stopPropagation();
        const p=$('#notif-panel');
        if(p)p.style.display=p.style.display==='none'?'flex':'none';
      });
      document.addEventListener('click',(e)=>{
        if(!e.target.closest('#notif-panel')){
          const p=$('#notif-panel');
          if(p)p.style.display='none';
        }
      });
    }
    document.addEventListener('click',event=>{const route=event.target.closest('[data-route]');if(route)return navigate(route.dataset.route);const close=event.target.closest('[data-close]');if(close)return $('#'+close.dataset.close).close();if(event.target.closest('[data-preview-editor]'))return previewEditor();if(event.target.closest('[data-new-record]'))return openNewRecord();const edit=event.target.closest('[data-edit-record]');if(edit)return openRecord(edit.dataset.editRecord);const duplicate=event.target.closest('[data-duplicate-schedule]');if(duplicate)return duplicateSchedule(duplicate.dataset.duplicateSchedule);const del=event.target.closest('[data-delete-record]');if(del)return requestDelete(del.dataset.deleteRecord,del);const ew=event.target.closest('[data-edit-workflow]');if(ew)return openWorkflow(ew.dataset.editWorkflow);const rw=event.target.closest('[data-resubmit-workflow]');if(rw)return resubmitWorkflow(rw.dataset.resubmitWorkflow,rw);const cw=event.target.closest('[data-cancel-workflow]');if(cw)return cancelWorkflow(cw.dataset.cancelWorkflow,cw);const dw=event.target.closest('[data-delete-workflow]');if(dw){if(!confirm('Hapus draft ini secara permanen?'))return;setBusy(dw,true);return server('adminDeleteWorkflow',[dw.dataset.deleteWorkflow]).then(()=>{toast('Draft dihapus.');loadEntity(state.entity)}).catch(e=>toast(cleanError(e.message))).finally(()=>setBusy(dw,false))}if(event.target.closest('[data-dashboard-refresh]'))return loadDashboardSummary(true);if(event.target.closest('[data-reload]')||event.target.closest('[data-retry]'))return renderRoute();const approvalTab=event.target.closest('[data-approval-status]');if(approvalTab)return loadApprovals(approvalTab.dataset.approvalStatus);const reviewButton=event.target.closest('[data-open-review]');if(reviewButton)return openReview(reviewButton.dataset.openReview);const reviewAction=event.target.closest('[data-review]');if(reviewAction)return review(reviewAction.dataset.review);const deleteApprovalButton=event.target.closest('[data-delete-approval]');if(deleteApprovalButton)return deleteApproval(deleteApprovalButton.dataset.deleteApproval);const service=event.target.closest('[data-open-service]');if(service)return openService(service.dataset.openService);const deleteServiceButton=event.target.closest('[data-delete-service]');if(deleteServiceButton)return deleteService(deleteServiceButton.dataset.deleteService);const sharePrayerButton=event.target.closest('[data-share-prayer]');if(sharePrayerButton)return sharePrayer(sharePrayerButton.dataset.sharePrayer);if(event.target.closest('[data-new-user]'))return openUser('');const eu=event.target.closest('[data-edit-user]');if(eu)return openUser(eu.dataset.editUser);const du=event.target.closest('[data-delete-user]');if(du)return deleteUser(du.dataset.deleteUser,du);const sys=event.target.closest('[data-system]');if(sys)return runSystem(sys.dataset.system,sys)});
    function queueSearch(render,inputId){clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>{render();requestAnimationFrame(()=>{const input=$('#'+inputId);if(!input)return;input.focus();const end=input.value.length;input.setSelectionRange(end,end)})},180)}
    document.addEventListener('input',event=>{if(event.target.id==='entity-search'){state.search=event.target.value;queueSearch(renderEntity,'entity-search')}if(event.target.id==='service-search'){state.search=event.target.value;queueSearch(renderServices,'service-search')}});
    document.addEventListener('change',event=>{if(event.target.id==='entity-status'){state.status=event.target.value;renderEntity()}if(event.target.id==='service-status'){state.status=event.target.value;renderServices()}if(event.target.matches('.image-file'))uploadImage(event.target);if(event.target.id==='schedule-section'){const section=state.entityData.sections.find(s=>s.id===event.target.value);$('#schedule-fields').innerHTML=scheduleFieldsHtml(section,{})}});
    $('#editor-form').addEventListener('submit',saveEditor);$('#user-form').addEventListener('submit',saveUser);$('#save-service').addEventListener('click',saveService);
    window.addEventListener('hashchange',()=>{const route=location.hash.slice(1);if(route&&route!==state.route)navigate(route)});
    async function boot(){applyTheme(currentTheme());try{state.boot=await server('adminGetBootstrap',[],30000);$('#root').innerHTML=shell();bindShell();const route=location.hash.slice(1)||'dashboard';navigate(route);$('#loader').classList.add('hidden');loadDashboardSummary(false)}catch(error){showGate(error)}}
    boot();
  })();
  </script>
</body>
</html>
