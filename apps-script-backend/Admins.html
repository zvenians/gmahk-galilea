<!doctype html>
<html lang="id" data-theme="light" data-build="GALILEA-ADMIN-PRO-47-0-0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
  <meta name="theme-color" content="#eef0e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07110c" media="(prefers-color-scheme: dark)">
  <style>
    /* ═══════════════════════════════════════════════════════════════════════
       GMAHK GALILEA ADMIN CONTROL CENTER — EDITORIAL PRODUCT REDESIGN v45.0
       Principles: Less Interface, More Clarity · Editorial Whitespace · Calm
       ═══════════════════════════════════════════════════════════════════════ */

    :root {
      /* ── Light Mode Foundation */
      --bg: #ffffff;
      --sidebar-bg: #fafaf9;
      --surface: #ffffff;
      --surface-2: #f7f7f5;
      --surface-3: #f0f0ee;
      --surface-translucent: rgba(250, 250, 249, 0.95);

      /* Typography */
      --text: #171717;
      --soft: #6b6b6b;
      --faint: #9b9b9b;

      /* Structural */
      --line: #e8e8e6;
      --line-subtle: rgba(232, 232, 230, 0.5);

      /* GMAHK Green Accent */
      --brand: #1a6b3a;
      --brand-hover: #145530;
      --brand-2: #1e7a43;
      --brand-soft: #eef5f1;
      --brand-active-bg: #eef5f1;
      --brand-active-text: #1a6b3a;

      /* Legacy aliases (kept for compat) */
      --gold: #1a6b3a;
      --gold-soft: #eef5f1;

      /* Semantic */
      --danger: #c0392b;
      --danger-soft: #fdecea;
      --warning: #d97706;
      --warning-soft: #fef3cd;
      --success: #1a6b3a;
      --success-soft: #eef5f1;

      /* Elevation */
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.06);
      --shadow: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);

      /* Layout */
      --sidebar: 228px;
      --topbar: 58px;
      --radius-sm: 8px;
      --radius: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --admin-radius: 8px;
      --admin-gap: 16px;

      /* Motion */
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --dur: 0.2s;
    }

    [data-theme="dark"] {
      --bg: #111211;
      --sidebar-bg: #0d0e0d;
      --surface: #181a18;
      --surface-2: #1d1f1d;
      --surface-3: #222422;
      --surface-translucent: rgba(13, 14, 13, 0.96);

      --text: #f5f5f3;
      --soft: #a4a6a3;
      --faint: #6b6d6a;

      --line: #2b2d2b;
      --line-subtle: rgba(43, 45, 43, 0.5);

      --brand: #4caf70;
      --brand-hover: #5dc47f;
      --brand-2: #3d9a5f;
      --brand-soft: #162a1e;
      --brand-active-bg: #162a1e;
      --brand-active-text: #4caf70;

      --gold: #4caf70;
      --gold-soft: #162a1e;

      --danger: #e57373;
      --danger-soft: #2d1515;
      --warning: #fbbf24;
      --warning-soft: #2a1f0a;
      --success: #4caf70;
      --success-soft: #162a1e;

      --shadow-xs: 0 1px 2px rgba(0,0,0,0.5);
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.6);
      --shadow: 0 4px 16px rgba(0,0,0,0.7);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.8);
    }

    /* ── Document Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box }
    html, body { min-height: 100%; margin: 0; max-width: 100%; overflow-x: hidden }
    html { background: var(--bg); scroll-behavior: smooth; color-scheme: light }
    html[data-theme="dark"] { color-scheme: dark }

    body {
      min-width: 0;
      color: var(--text);
      background: var(--bg);
      font: 14.5px/1.55 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.012em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-x: none;
    }

    button, input, select, textarea { font: inherit }
    button, a { color: inherit }
    button { cursor: pointer; border: 0; background: transparent }
    a { text-decoration: none }
    img { display: block; max-width: 100% }

    h1, h2, h3, p { margin-top: 0 }
    h1, h2, h3 { line-height: 1.1; letter-spacing: -0.038em; font-weight: 750 }
    h1 { font-size: clamp(2rem, 4.2vw, 3.8rem) }
    h2 { font-size: clamp(1.45rem, 2.6vw, 2.2rem) }
    h3 { font-size: 1.05rem }
    h1, h2, h3, p, strong, span, label, small, button, a, dd, dt, pre { overflow-wrap: anywhere }

    .muted { color: var(--soft) }
    .faint { color: var(--faint) }
    .small { font-size: 0.76rem }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }


    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    /* ── Icons ─────────────────────────────────────────────────────── */
    .icon {
      width: 18px;
      height: 18px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: 0 0 auto;
    }

    /* ── App Shell ─────────────────────────────────────────────────── */
    .admin-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .admin-shell, .workspace, .content, .topbar, .sidebar, .page-head, .toolbar,
    .record-grid, .quick-grid, .grid, .card, .record, .metric, .quick-action,
    .workflow-item, .approval-card, .service-card, .user-card, .payload,
    .modal-head, .modal-body, .modal-foot, .form-grid, .field {
      min-width: 0;
      max-width: 100%;
    }

    /* ── Sidebar: Quiet & Product-Centric ──────────────────────────── */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 70;
      width: var(--sidebar);
      display: flex;
      flex-direction: column;
      padding: 16px 10px 14px;
      border-right: 1px solid var(--line);
      background: var(--sidebar-bg);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 14px;
      border-bottom: 1px solid var(--line);
      transition: opacity var(--dur) var(--ease);
    }
    .brand:hover { opacity: 0.8 }

    .brand strong, .brand span {
      display: block;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .brand strong {
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .brand span {
      margin-top: 1px;
      color: var(--faint);
      font-size: 0.62rem;
      font-weight: 500;
    }

    .nav-scroll {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    .nav-label {
      margin: 16px 10px 6px;
      color: var(--faint);
      font-size: 0.59rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav-item {
      position: relative;
      width: 100%;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      color: var(--soft);
      background: transparent;
      text-align: left;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: all var(--dur) var(--ease);
    }

    .nav-item:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--brand) 6%, var(--sidebar-bg));
    }

    .nav-item.active {
      color: var(--brand-active-text);
      background: var(--brand-active-bg);
      font-weight: 700;
    }

    .nav-item .count {
      margin-left: auto;
      min-width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border-radius: 999px;
      color: var(--brand-active-text);
      background: var(--brand-soft);
      font-size: 0.6rem;
      font-weight: 800;
    }
    .nav-item.active .count {
      color: var(--brand-active-text);
      background: color-mix(in srgb, var(--brand) 15%, var(--brand-active-bg));
    }

    .sidebar-user {
      margin-top: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }

    .user-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .avatar {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 7px;
      color: #fff;
      background: var(--brand);
      font-weight: 700;
      font-size: 0.75rem;
    }

    .sidebar-user strong, .sidebar-user span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .sidebar-user strong { font-size: 0.76rem; font-weight: 650 }
    .sidebar-user span { color: var(--faint); font-size: 0.62rem }
    .sidebar-user .user-row > span:last-child { min-width: 0 }

    .build-badge { display: none !important }

    /* ── Topbar (Navbar) ───────────────────────────────────────────── */
    .workspace {
      min-width: 0;
      grid-column: 2;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 45;
      min-height: var(--topbar);
      height: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px clamp(16px, 3vw, 40px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(16px);
    }

    .crumb strong, .crumb span { display: block }
    .crumb strong {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .crumb span {
      color: var(--faint);
      font-size: 0.68rem;
    }
    .crumb { min-width: 0 }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }
    .mobile-menu { display: none }
    .mobile-overlay { display: none }

    /* ── Content Area: Generous Whitespace ─────────────────────────── */
    .content {
      flex: 1 0 auto;
      width: min(1360px, calc(100% - clamp(28px, 5vw, 80px)));
      margin: 0 auto;
      padding: clamp(28px, 4vw, 56px) 0 72px;
    }

    /* ── 1. EDITORIAL WELCOME (REPLACES GIANT HERO) ─────────────────── */
    .editorial-welcome {
      margin-bottom: 32px;
    }
    .welcome-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 28px;
      flex-wrap: wrap;
    }
    .welcome-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--brand);
      text-transform: uppercase;
    }
    .eyebrow-sep { opacity: 0.4 }
    .welcome-title {
      margin-bottom: 6px;
      max-width: 780px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.04;
      letter-spacing: -0.04em;
    }
    .welcome-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      margin-bottom: 20px;
    }
    .welcome-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--soft);
      font-size: 0.78rem;
      font-weight: 500;
    }
    .welcome-meta-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--brand);
      opacity: 0.5;
    }
    .welcome-meta-status { color: var(--brand); font-weight: 600 }
    .welcome-sub {
      max-width: 560px;
      color: var(--soft);
      font-size: 0.88rem;
      line-height: 1.6;
      margin-bottom: 0;
    }
    .welcome-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .dashboard-sync-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      font-size: 0.71rem;
      color: var(--soft);
    }
    .sync-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sync-meta .icon { color: var(--brand); width: 14px; height: 14px }
    .dashboard-sync-strip.is-loading .icon { animation: spin 1.2s linear infinite }
    .dashboard-sync-strip.is-error {
      color: var(--danger);
      background: var(--danger-soft);
    }
    .btn-sync {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      font-size: 0.67rem;
      font-weight: 600;
      color: var(--text);
      transition: all var(--dur) var(--ease);
    }
    .btn-sync:hover { border-color: var(--brand); color: var(--brand) }

    /* ── 2. EDITORIAL METRICS BAR (REPLACES 4 CARDS) ────────────────── */
    .editorial-metrics-section {
      margin-bottom: 32px;
    }
    .section-label {
      color: var(--faint);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .editorial-metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
      overflow: hidden;
    }
    .metric-block {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      transition: background var(--dur) var(--ease);
      cursor: default;
    }
    .metric-block:hover { background: var(--surface-2) }
    .metric-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .metric-name {
      color: var(--faint);
      font-size: 0.68rem;
      font-weight: 700;
    }
    .metric-icon-small {
      color: var(--brand);
      opacity: 0.7;
    }
    .metric-icon-small .icon { width: 15px; height: 15px }
    .metric-number {
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 8px 0 3px;
      color: var(--text);
    }
    .metric-caption {
      color: var(--soft);
      font-size: 0.7rem;
    }
    .metric-divider {
      width: 1px;
      background: var(--line);
    }

    /* ── PERLU PERHATIAN (ATTENTION SECTION) ────────────────────────── */
    .dashboard-attention-section {
      margin-bottom: 32px;
    }
    .attention-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .attention-header h2 {
      font-size: 1.0rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0;
    }
    .attention-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--danger);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 800;
    }
    .attention-list {
      display: grid;
      gap: 6px;
    }
    .attention-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      text-align: left;
      transition: all var(--dur) var(--ease);
      cursor: pointer;
    }
    .attention-item:hover {
      border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
      background: var(--brand-soft);
    }
    .attention-count {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      min-width: 36px;
      line-height: 1;
    }
    .attention-text strong {
      display: block;
      font-size: 0.84rem;
      font-weight: 650;
      color: var(--text);
    }
    .attention-text span {
      display: block;
      margin-top: 1px;
      color: var(--soft);
      font-size: 0.72rem;
    }
    .attention-arrow {
      margin-left: auto;
      color: var(--faint);
    }

    /* ── AKTIVITAS MINI (MINI ACTIVITY FEED) ────────────────────────── */
    .dashboard-activity-section {
      margin-bottom: 32px;
    }
    .activity-mini-list {
      display: grid;
      gap: 2px;
    }
    .activity-mini-row {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      align-items: start;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }
    .activity-mini-row:last-child { border-bottom: 0 }
    .activity-mini-time {
      color: var(--faint);
      font-size: 0.68rem;
      font-weight: 600;
      padding-top: 1px;
    }
    .activity-mini-text strong {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
    }
    .activity-mini-text span {
      display: block;
      margin-top: 1px;
      color: var(--soft);
      font-size: 0.7rem;
    }

    /* ── TOAST WITH UNDO ────────────────────────────────────────────── */
    .toast-undo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--brand);
      font-size: 0.76rem;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }
    .toast-undo:hover { opacity: 0.8 }

    /* ── 3. COMPACT ACTION TILES (REPLACES 7 CARDS) ────────────────── */
    .editorial-actions-section {
      margin-bottom: 38px;
    }
    .section-head-clean {
      margin-bottom: 14px;
    }
    .section-head-clean h2 {
      font-size: 1.35rem;
      font-weight: 750;
      letter-spacing: -0.025em;
      margin: 0;
    }
    .actions-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
    }
    .action-tile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      text-align: left;
      transition: all var(--dur) var(--ease);
      box-shadow: var(--shadow-xs);
    }
    .action-tile:hover {
      border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .action-tile-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 8px;
      color: var(--brand);
      background: var(--brand-soft);
    }
    .action-tile-icon .icon { width: 19px; height: 19px }
    .action-tile-body {
      flex: 1 1 auto;
      min-width: 0;
    }
    .action-tile-body strong {
      display: block;
      font-size: 0.86rem;
      font-weight: 750;
      letter-spacing: -0.015em;
    }
    .action-tile-body span {
      display: block;
      color: var(--soft);
      font-size: 0.71rem;
      line-height: 1.4;
      margin-top: 1px;
    }
    .action-tile-arrow {
      color: var(--faint);
      opacity: 0.6;
      transition: transform var(--dur) var(--ease);
      flex: 0 0 auto;
    }
    .action-tile:hover .action-tile-arrow {
      color: var(--brand);
      opacity: 1;
      transform: translateX(3px);
    }

    /* ── Buttons & Standard Controls ───────────────────────────────── */
    .btn {
      position: relative;
      overflow: hidden;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--text);
      background: var(--surface);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: all var(--dur) var(--ease);
      box-shadow: var(--shadow-xs);
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
      box-shadow: var(--shadow-sm);
    }
    .btn.primary {
      color: #ffffff;
      border-color: transparent;
      background: var(--brand);
    }
    .btn.primary:hover {
      background: var(--brand-hover);
    }
    .btn.soft {
      color: var(--brand);
      border-color: transparent;
      background: var(--brand-soft);
      box-shadow: none;
    }
    .btn.soft:hover {
      background: color-mix(in srgb, var(--brand-soft) 75%, var(--brand));
    }
    .btn.danger {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 30%, var(--line));
      background: var(--danger-soft);
      box-shadow: none;
    }
    .btn.danger:hover {
      border-color: var(--danger);
      background: color-mix(in srgb, var(--danger-soft) 70%, var(--danger));
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--soft);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
      transition: all var(--dur) var(--ease);
    }
    .icon-btn:hover {
      color: var(--brand);
      border-color: color-mix(in srgb, var(--brand) 50%, var(--line));
      transform: translateY(-1px);
    }

    /* ── Content Management & Records List ─────────────────────────── */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .page-head h1 {
      margin-bottom: 4px;
      font-size: clamp(1.8rem, 3.6vw, 3rem);
      letter-spacing: -0.035em;
    }
    .page-head p {
      color: var(--soft);
      margin: 0;
      font-size: 0.88rem;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
      color: var(--brand);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      width: 14px;
      height: 1.5px;
      content: "";
      background: currentColor;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
      flex-wrap: wrap;
    }
    .toolbar :is(input, select, .search) {
      min-height: 36px;
      max-width: 100%;
    }
    .search {
      min-width: 200px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 6px;
    }
    .search input {
      width: 100%;
      height: 32px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 0.82rem;
    }
    .filters {
      display: flex;
      gap: 6px;
    }

    select, input, textarea {
      width: 100%;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--text);
      background: var(--surface);
      font-size: 0.84rem;
      transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent);
    }
    textarea { min-height: 120px; resize: vertical }
    option { color: var(--text); background: var(--surface) }
    label { color: var(--soft); font-size: 0.7rem; font-weight: 750 }
    .field { display: grid; gap: 5px }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px }
    .field.full { grid-column: 1/-1 }
    .help { color: var(--faint); font-size: 0.65rem }

    /* ── Record Items / Hybrid Table Layout ────────────────────────── */
    .record-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
      gap: 14px;
    }
    .card {
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
      transition: all var(--dur) var(--ease);
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--brand) 34%, var(--line));
      box-shadow: var(--shadow-sm);
    }
    .record {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      height: 100%;
    }
    .record-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .record h3 {
      margin: 10px 0 6px;
      font-size: 1.05rem;
    }
    .record-summary {
      display: -webkit-box;
      overflow: hidden;
      color: var(--soft);
      font-size: 0.77rem;
      line-height: 1.5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .record-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-top: 14px;
      align-self: end;
      justify-content: flex-end;
    }
    .record-actions .btn { flex: 1 1 90px }

    /* ── Status Pills ──────────────────────────────────────────────── */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 25px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--soft);
      background: var(--surface-2);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .status::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      content: "";
      background: var(--faint);
    }
    .status.publish::before, .status.approved::before { background: var(--success) }
    .status.pending::before { background: var(--warning) }
    .status.rejected::before { background: var(--danger) }
    .status.draft::before { background: var(--faint) }

    [data-theme="light"] .status { color: #1e3325; background: #eef3eb }
    [data-theme="dark"] .status { color: #e4eee2; background: #152a1d }

    /* ── Workflows & Steppers ──────────────────────────────────────── */
    .workflow-strip { display: grid; gap: 9px; margin-bottom: 20px }
    .workflow-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) minmax(160px, auto);
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    .workflow-item strong, .workflow-item span { display: block }
    .workflow-item span { color: var(--faint); font-size: 0.68rem }
    .workflow-item .button-row { justify-content: flex-end }
    .workflow-copy { display: grid; gap: 2px; min-width: 0 }
    .workflow-note {
      margin-top: 3px;
      padding: 6px 9px;
      border-left: 3px solid var(--warning);
      border-radius: 0 6px 6px 0;
      color: var(--soft);
      background: var(--surface-2);
      font-size: 0.71rem;
    }

    .workflow-guide {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 20px;
    }
    .workflow-step {
      position: relative;
      display: grid;
      gap: 3px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--faint);
      background: var(--surface-2);
    }
    .workflow-step::after {
      position: absolute;
      top: 50%;
      right: -7px;
      width: 8px;
      height: 1px;
      content: "";
      background: var(--line);
    }
    .workflow-step:last-child::after { display: none }
    .workflow-step b { font-size: 0.67rem; letter-spacing: 0.03em }
    .workflow-step span { font-size: 0.62rem }
    .workflow-step.active {
      color: var(--text);
      border-color: color-mix(in srgb, var(--brand) 42%, var(--line));
      background: var(--brand-soft);
      box-shadow: inset 3px 0 0 var(--brand);
    }
    .workflow-step.done { color: var(--brand) }

    .status-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 0 16px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    .status-legend > span:last-child {
      align-self: center;
      margin-left: auto;
      color: var(--faint);
      font-size: 0.68rem;
    }

    /* ── Approvals Section ─────────────────────────────────────────── */
    .approval-tabs {
      position: sticky;
      z-index: 8;
      top: calc(var(--topbar) + 8px);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(16px);
      margin-bottom: 16px;
    }
    .approval-tab {
      min-height: 34px;
      padding: 6px 13px;
      border: 0;
      border-radius: 6px;
      color: var(--soft);
      background: transparent;
      font-weight: 750;
      font-size: 0.77rem;
      transition: all var(--dur) var(--ease);
    }
    .approval-tab:hover, .approval-tab.active {
      color: var(--text);
      background: var(--brand-soft);
    }
    .approval-list { display: grid; gap: 11px }
    .approval-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 18px 20px;
    }
    .approval-card > div:first-child { min-width: 0 }
    .approval-card h3 {
      font-size: 1.15rem;
      margin-top: 10px;
    }
    .approval-card > .button-row {
      min-width: 160px;
      justify-content: flex-end;
    }
    .approval-meta, .service-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      color: var(--faint);
      font-size: 0.69rem;
    }
    .payload {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
      gap: 8px 14px;
      margin-top: 12px;
      padding: 12px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }
    .payload div { min-width: 0 }
    .payload small, .payload strong { display: block }
    .payload small {
      color: var(--faint);
      font-size: 0.61rem;
      text-transform: uppercase;
      font-weight: 750;
    }
    .payload strong {
      margin-top: 2px;
      font-size: 0.76rem;
      line-height: 1.45;
      color: var(--soft);
    }
    .payload .payload-wide { grid-column: 1/-1 }

    /* ── Services Section ──────────────────────────────────────────── */
    .service-list { display: grid; gap: 12px }
    .service-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 0.34fr);
      align-items: center;
      gap: 20px;
      padding: 20px;
    }
    .service-card h3 { margin: 8px 0 5px; font-size: 1.15rem }
    .service-card p {
      max-width: 720px;
      margin: 0 0 8px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .service-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: center;
      justify-content: flex-end;
    }
    .service-actions .btn { justify-content: center }
    .privacy-chip {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      padding: 3px 9px;
      border-radius: 999px;
      color: var(--text);
      background: var(--brand-soft);
      font-size: 0.62rem;
      font-weight: 800;
    }
    .service-card.restricted { border-style: dashed }
    [data-theme="light"] .privacy-chip { color: #132019 }
    [data-theme="dark"] .privacy-chip { color: #f5f7ef }

    /* ── Users & Roles ─────────────────────────────────────────────── */
    .user-list { display: grid; gap: 11px }
    .user-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 18px;
    }
    .user-card .button-row { align-self: center }
    .role-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .role-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    .role-card strong, .role-card span { display: block }
    .role-card strong { font-weight: 800; font-size: 0.88rem }
    .role-card span {
      margin-top: 4px;
      color: var(--soft);
      font-size: 0.68rem;
      line-height: 1.4;
    }

    /* ── Activity Logs ─────────────────────────────────────────────── */
    .activity-list { display: grid; gap: 9px }
    .activity-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: start;
      gap: 12px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-xs);
    }
    .activity-dot {
      width: 9px;
      height: 9px;
      margin-top: 5px;
      border: 2px solid var(--brand-soft);
      border-radius: 50%;
      background: var(--brand);
    }
    .activity-row strong, .activity-row span { display: block }
    .activity-row span { color: var(--soft); font-size: 0.71rem }
    .activity-row time { color: var(--faint); font-size: 0.65rem; text-align: right }

    /* ── Apple-Style Modal Sheets ──────────────────────────────────── */
    dialog {
      width: min(700px, calc(100vw - 20px));
      max-height: calc(100dvh - 20px);
      max-width: min(700px, calc(100vw - 20px));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 20px;
      margin: auto;
      overflow: hidden;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }
    dialog::backdrop {
      background: rgba(3, 9, 5, 0.65);
      backdrop-filter: blur(14px);
    }
    dialog[open] { display: flex; flex-direction: column }
    dialog > form {
      width: 100%;
      min-width: 0;
      max-height: calc(100dvh - 20px);
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }
    .modal-head > div:first-child { min-width: 0 }
    .modal-head strong, .modal-head span { display: block; overflow-wrap: anywhere }
    .modal-head strong { font-size: 0.98rem }
    .modal-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: clamp(18px, 3vw, 28px);
    }
    .modal-foot {
      position: sticky;
      bottom: 0;
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .review-title { margin: 12px 0 4px }
    .review-reason {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--line));
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--danger) 5%, var(--surface));
      scroll-margin: 14px;
    }
    .review-reason.show {
      display: grid !important;
      gap: 11px;
      animation: reason-in 0.24s var(--ease);
    }
    .reason-head { display: flex; gap: 9px; align-items: flex-start }
    .reason-head .icon { margin-top: 2px; color: var(--danger) }
    .reason-head strong, .reason-head span { display: block }
    .reason-head span { margin-top: 2px; color: var(--soft); font-size: 0.71rem }
    .review-reason textarea {
      min-height: 110px;
      border-color: color-mix(in srgb, var(--danger) 26%, var(--line));
      background: var(--surface);
    }
    .reason-help { color: var(--faint); font-size: 0.66rem }
    .reason-help.error { color: var(--danger); font-weight: 800 }
    @keyframes reason-in { from { opacity: 0; transform: translateY(5px) } }

    /* ── Editor Preview & Projector ────────────────────────────────── */
    .editor-preview {
      display: none;
      grid-column: 1/-1;
      margin-top: 6px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }
    .editor-preview.show { display: block }
    .editor-preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .editor-preview-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }
    .editor-preview-card h3 { margin: 4px 0 6px }
    .editor-preview-card dl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0 0;
    }
    .editor-preview-card dl div {
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--surface-2);
    }
    .editor-preview-card dt {
      color: var(--faint);
      font-size: 0.62rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .editor-preview-card dd { margin: 3px 0 0; white-space: pre-wrap }
    .editor-validation { display: grid; gap: 6px; margin-bottom: 12px }
    .editor-validation-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      color: var(--soft);
      background: var(--surface);
    }
    .editor-validation-row.ready .icon { color: var(--success) }
    .editor-validation-row.warning .icon { color: var(--warning) }

    .editor-projector {
      position: relative;
      aspect-ratio: 16/9;
      display: grid;
      grid-template-columns: minmax(120px, 0.62fr) minmax(0, 1.38fr);
      gap: 12px;
      padding: 14px;
      overflow: hidden;
      border-radius: var(--radius-sm);
      color: #fff;
      background:
        radial-gradient(circle at 90% 0, rgba(221, 197, 125, 0.18), transparent 30%),
        linear-gradient(135deg, #03130a, #15452b);
    }
    .editor-projector::after {
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(239, 214, 146, 0.3);
      border-radius: 10px;
      content: "";
      pointer-events: none;
    }
    .editor-projector > * { position: relative; z-index: 1 }
    .editor-projector-title {
      display: flex;
      min-width: 0;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.26);
    }
    .editor-projector-title small {
      color: #e5cb81;
      font-size: 0.54rem;
      font-weight: 850;
      letter-spacing: 0.1em;
    }
    .editor-projector-title strong {
      margin-top: 5px;
      font-size: clamp(1rem, 2.6vw, 1.75rem);
      line-height: 0.94;
    }
    .editor-projector-title span {
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.61rem;
    }
    .editor-projector-fields {
      display: grid;
      align-content: center;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px 10px;
      margin: 0;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.2);
    }
    .editor-projector-fields div {
      min-width: 0;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }
    .editor-projector-fields dt {
      color: #dfc579;
      font-size: 0.47rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .editor-projector-fields dd {
      margin: 2px 0 0;
      overflow: hidden;
      font-size: clamp(0.65rem, 1.4vw, 0.95rem);
      font-weight: 750;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .image-upload-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
    }
    .image-upload-panel strong, .image-upload-panel span { display: block }
    .image-upload-panel span { margin-top: 2px; color: var(--soft); font-size: 0.7rem }
    .image-collection { min-height: 130px }

    /* ── Empty State ───────────────────────────────────────────────── */
    .empty {
      padding: 44px 18px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--soft);
      text-align: center;
    }
    .empty .icon {
      width: 30px;
      height: 30px;
      margin: 0 auto 12px;
      color: var(--brand);
    }

    /* ── Minimalist Footer ─────────────────────────────────────────── */
    .admin-footer {
      flex: 0 0 auto;
      border-top: 1px solid var(--line);
      padding: 20px clamp(18px, 3vw, 44px);
      margin-top: auto;
      color: var(--faint);
      font-size: 0.71rem;
    }
    .footer-inner {
      width: min(1320px, calc(100% - clamp(28px, 5vw, 76px)));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* ── Loader & Gate ─────────────────────────────────────────────── */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      color: #eff6ec;
      background: radial-gradient(38rem 30rem at 50% 45%, #224730, #051008 75%);
      transition: opacity 0.35s var(--ease), visibility 0.35s var(--ease);
    }
    .loader.hidden { opacity: 0; visibility: hidden }
    .loader-mark {
      position: relative;
      width: 114px;
      height: 114px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
    }
    .loader-mark::before, .loader-mark::after {
      position: absolute;
      inset: -12px;
      border: 1px solid rgba(226, 210, 165, 0.2);
      border-radius: 50%;
      content: "";
      animation: cinema-ring 2.6s var(--ease) infinite;
    }
    .loader-mark::after { inset: -36px; animation-delay: -1.3s }
    @keyframes cinema-ring { 0%, 100% { transform: scale(0.9); opacity: 0.2 } 50% { transform: scale(1.06); opacity: 0.75 } }
    .orbit { position: absolute; inset: 0; border: 1px solid rgba(220, 237, 214, 0.28); border-radius: 50%; animation: spin 2.8s linear infinite }
    .orbit::after { position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; border-radius: 50%; content: ""; background: #d9c080; box-shadow: 0 0 16px #d9c080 }
    @keyframes spin { to { transform: rotate(360deg) } }
    .cross { display: none !important }
    .loader-advent { width: 56px; height: 56px; object-fit: contain; filter: none !important; animation: admin-float 2.2s ease-in-out infinite }
    .loader-note { display: block; margin-top: 5px; color: rgba(244, 248, 240, 0.55); font-size: 0.59rem; font-weight: 700; letter-spacing: 0.14em; text-align: center; text-transform: uppercase }
    .loader p { color: rgba(255, 255, 255, 0.72); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-align: center }
    @keyframes admin-float { 50% { transform: translateY(-4px) } }

    .gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(40rem 30rem at 50% 25%, color-mix(in srgb, var(--brand) 14%, transparent), transparent 72%), var(--bg);
    }
    .gate-card {
      width: min(640px, 100%);
      padding: clamp(30px, 6vw, 64px);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      text-align: left;
    }
    .gate-logo { width: 62px; height: 62px; margin: 0 0 22px; object-fit: contain; display: block; filter: none !important }
    .gate-card h1 { max-width: 520px; font-size: clamp(2.5rem, 7vw, 5rem); letter-spacing: -0.06em }
    .gate-message { font-size: 0.95rem }
    .steps { display: grid; gap: 9px; margin: 24px 0; text-align: left }
    .step { display: flex; gap: 11px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2) }
    .step b { width: 25px; height: 25px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 7px; color: #fff; background: var(--brand-2) }

    .toast-zone { position: fixed; right: 16px; bottom: 16px; z-index: 400; display: grid; gap: 8px }
    .toast { max-width: 350px; padding: 12px 15px; border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text); background: var(--surface); box-shadow: var(--shadow); animation: toast 0.3s var(--ease); font-size: 0.79rem; font-weight: 650 }
    @keyframes toast { from { opacity: 0; transform: translateY(8px) } }

    /* GALILEA-ADMIN-BOOTSTRAP-35-8-0 */
    .theme-logo-pair { position: relative; display: grid; flex: 0 0 auto; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 3px 10px rgba(13, 49, 29, 0.07); isolation: isolate }
    .theme-logo-pair > img { grid-area: 1/1; width: 100%; height: 100%; object-fit: cover; filter: none !important; opacity: 1; transition: opacity 0.22s var(--ease) }
    .theme-logo-pair .logo-dark { display: none }
    [data-theme="dark"] .theme-logo-pair .logo-light { display: none }
    [data-theme="dark"] .theme-logo-pair .logo-dark { display: block }
    .brand-logo { width: 40px; height: 40px; filter: none !important }
    .brand:hover .theme-logo-pair > img { transform: scale(1.04) }
    .official-advent-logo { display: block; object-fit: contain }
    [data-theme="dark"] .gate-logo { filter: brightness(0) invert(1) }

    [data-theme="light"] .nav-item { color: var(--soft) }
    [data-theme="light"] .nav-item.active { color: var(--brand-active-text) }
    [data-theme="dark"] .nav-item { color: var(--soft) }
    [data-theme="dark"] .nav-item.active { color: var(--brand-active-text) }

    [data-theme="dark"] :is(.card, .record, .service-card, .user-card, .metric-block, .action-tile, .role-card, .workflow-item, .toolbar, dialog > form, .editorial-metrics-bar) {
      color: var(--text);
      border-color: var(--line);
      background: var(--surface);
    }
    [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea {
      color: var(--text);
      background: var(--surface-2);
      border-color: var(--line);
    }
    [data-theme="dark"] option { color: var(--text); background: var(--surface-2) }

    /* ── Responsive Architecture Lock ──────────────────────────────── */
    /* responsive admin lock: iPhone, Android, tablet, dan desktop */
    @media (min-width: 851px) {
      .workspace { margin-left: 0 }
      .content { width: min(1320px, calc(100% - clamp(28px, 5vw, 76px))) }
    }

    @media (max-width: 1000px) {
      .editorial-metrics-bar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .metric-divider:nth-child(4) { display: none }
    }

    @media (max-width: 850px) {
      :root { --topbar: 66px }
      .admin-shell { display: block; min-height: 100dvh }
      .workspace { width: 100%; min-height: 100dvh; grid-column: auto }
      .sidebar {
        inset: 0 auto 0 0;
        width: min(86vw, 300px);
        height: 100dvh;
        padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));
        overflow: hidden;
        transform: translate3d(-105%, 0, 0);
        transition: transform 0.3s var(--ease);
      }
      .sidebar.open { transform: translate3d(0, 0, 0) }
      .nav-scroll { overscroll-behavior: contain; -webkit-overflow-scrolling: touch }

      .mobile-menu { display: grid; flex: 0 0 38px }
      .mobile-overlay {
        position: fixed;
        inset: 0;
        z-index: 45;
        width: 100vw;
        height: 100dvh;
        display: block;
        background: rgba(3, 9, 5, 0.54);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.28s var(--ease), visibility 0.28s;
      }
      .mobile-overlay.open { opacity: 1; visibility: visible }

      .topbar {
        top: 0;
        width: calc(100% - 16px);
        min-height: var(--topbar);
        margin: calc(6px + env(safe-area-inset-top)) 8px 0;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        border-bottom: 0;
      }
      .crumb { min-width: 0 }
      .crumb strong { font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
      .crumb span { display: none }
      .top-actions { flex: 0 0 auto; flex-wrap: nowrap }
      .top-actions .icon-btn { flex: 0 0 38px }

      .content {
        width: calc(100% - 16px);
        margin-inline: 8px;
        padding: 20px 0 calc(40px + env(safe-area-inset-bottom));
      }
      .welcome-header { flex-direction: column; gap: 16px }
      .welcome-status-pill { width: 100%; justify-content: space-between }
      .welcome-title { font-size: clamp(2rem, 9vw, 3.8rem); line-height: 0.98 }
      .editorial-metrics-bar { grid-template-columns: repeat(2, minmax(0, 1fr)) }
      .actions-list-grid { grid-template-columns: 1fr }

      .approval-card, .service-card, .user-card { grid-template-columns: 1fr }
      .approval-card > .button-row, .service-card > .button-row, .user-card > .button-row { justify-content: flex-start }
      .workflow-item { grid-template-columns: auto minmax(0, 1fr) }
      .workflow-item > .button-row { grid-column: 1/-1; justify-content: flex-start }

      dialog { width: calc(100% - 16px); max-height: calc(100dvh - 16px); border-radius: 18px }
      dialog > form { max-height: calc(100dvh - 16px) }
      .modal-body { padding: 18px 16px; -webkit-overflow-scrolling: touch }
      .modal-head { padding: 12px 14px }
      .modal-foot { padding: 11px 14px calc(11px + env(safe-area-inset-bottom)) }
    }

    @media (max-width: 600px) {
      .editorial-metrics-bar { grid-template-columns: 1fr }
      .metric-divider { display: none }
      .form-grid { grid-template-columns: 1fr }
      .welcome-meta { flex-direction: column; align-items: flex-start; gap: 4px }
      .record { grid-template-columns: 1fr }
      .record-actions { justify-content: flex-start }
      .toolbar, .filters { flex-direction: column; align-items: stretch }
      .toolbar > *, .filters > * { width: 100% !important }
      .service-actions, .record-actions, .user-card .button-row { display: grid; grid-template-columns: 1fr; width: 100% }
      .service-actions .btn, .record-actions .btn, .user-card .btn, .approval-card .btn { width: 100%; justify-content: center }
      .approval-card > .button-row { display: grid; grid-template-columns: 1fr; width: 100% }
      .footer-inner { flex-direction: column; align-items: flex-start; gap: 6px }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .orbit, .loader-advent { animation: none !important }
      .loader-mark::before, .loader-mark::after { animation: none !important }
      .theme-logo-pair > img { transition: none }
    }
    .upload-preview-list { list-style: none; padding: 0; margin: 8px 0; display: flex; flex-direction: column; gap: 8px; }
    .upload-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 8px; background: var(--surface-2); font-size: 13px; border: 1px solid var(--line); }
    .upload-info { display: flex; flex-direction: column; gap: 2px; }
    .upload-name { font-weight: 500; color: var(--text); word-break: break-all; }
    .upload-size { color: var(--faint); font-size: 12px; }
    .upload-status { font-weight: 500; }
    .upload-item.pending .upload-status { color: var(--faint); }
    .upload-item.success .upload-status { color: var(--success); }
    .upload-item.error .upload-status { color: var(--danger); }
    /* Rich Text Editor & Photo Manager */
    .rich-editor { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .rich-editor:focus-within { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
    .rich-toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
    .rich-toolbar button { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 4px; color: var(--text); cursor: pointer; transition: background var(--dur); }
    .rich-toolbar button:hover { background: var(--line); }
    .rich-toolbar button.active { background: var(--line); color: var(--brand); }
    .rich-toolbar button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .rich-toolbar-sep { width: 1px; background: var(--line); margin: 4px; }
    .rich-content { min-height: 150px; padding: 12px; font-size: 14px; line-height: 1.6; outline: none; overflow-y: auto; max-height: 400px; }
    .rich-content p { margin: 0 0 1em 0; }
    .rich-content p:last-child { margin-bottom: 0; }
    .rich-content ul, .rich-content ol { margin: 0 0 1em 0; padding-left: 24px; }
    .rich-content li { margin-bottom: 4px; }
    .rich-content a { color: var(--brand); text-decoration: underline; }
    .photo-manager { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 12px; }
    .photo-thumb { position: relative; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); aspect-ratio: 1; display: flex; flex-direction: column; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-thumb-actions { position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity var(--dur); gap: 8px; }
    .photo-thumb:hover .photo-thumb-actions { opacity: 1; }
    .photo-thumb.is-primary .photo-thumb-actions { opacity: 1; background: transparent; justify-content: flex-start; align-items: flex-end; padding: 8px; }
    .btn-set-primary { background: var(--bg); color: var(--text); border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-sm); }
    .btn-set-primary:hover { background: var(--surface-3); }
    .photo-badge-primary { background: var(--brand); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; box-shadow: var(--shadow-sm); }
    .btn-remove-photo { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.5); color: #fff; border: none; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .btn-remove-photo:hover { background: var(--danger); }
  </style>

  <dialog id="user-dialog"><form id="user-form"><div class="modal-head"><strong>Pengelola Portal</strong><button class="icon-btn" type="button" data-close="user-dialog"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="modal-body"><div class="form-grid"><input type="hidden" name="id"><div class="field full"><label>Nama</label><input name="name" required></div><div class="field full"><label>Email Google</label><input name="email" type="email" required></div><div class="field"><label>Peran</label><select name="role"><option>VIEWER</option><option>EDITOR</option><option>APPROVER</option><option>SUPERADMIN</option></select></div><div class="field"><label>Status</label><select name="status"><option>AKTIF</option><option>NONAKTIF</option></select></div></div></div><div class="modal-foot"><button class="btn" type="button" data-close="user-dialog">Batal</button><button class="btn primary" type="submit">Simpan Pengelola</button></div></form></dialog>

  <script>
  (function(){
    'use strict';
    const APP_URL = <?!= JSON.stringify(appUrl || '') ?>;
    const $=(s,c)=>(c||document).querySelector(s), $$=(s,c)=>Array.from((c||document).querySelectorAll(s));
    const state={boot:null,route:'dashboard',entity:null,entityData:null,search:'',status:'ALL',approvalStatus:'PENDING',approvals:[],approvalCache:{},currentEdit:null,currentReview:null,reviewMode:'',currentService:null,users:[],services:[],activity:null,searchTimer:null,dashboardRequest:0};
    const icon=name=>'<svg class="icon"><use href="#i-'+name+'"/></svg>';
    const logoMark=className=>'<span class="theme-logo-pair '+attr(className||'brand-logo')+'" role="img" aria-label="Logo GMAHK Galilea"><img class="logo-light" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-light.webp" alt=""><img class="logo-dark" src="https://gmahk-galilea.vercel.app/assets/logo-galilea-dark.webp" alt=""></span>';
    const esc=value=>String(value==null?'':value).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
    const attr=esc;
    function server(name,args,timeoutMs){return new Promise((resolve,reject)=>{let done=false;const timer=setTimeout(()=>{if(!done){done=true;reject(new Error('Server admin belum merespons. Coba kembali; data Anda tidak berubah.'))}},Math.max(8000,Number(timeoutMs)||25000));const finish=fn=>value=>{if(done)return;done=true;clearTimeout(timer);fn(value)};if(typeof google!=='undefined'&&google.script&&google.script.run&&typeof google.script.run[name]==='function'){const runner=google.script.run.withSuccessHandler(finish(resolve)).withFailureHandler(finish(error=>reject(new Error(error&&error.message?error.message:String(error)))));runner[name].apply(runner,args||[]);return}fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:name,args:args||[]})}).then(res=>{if(!res.ok){const ct=res.headers.get('content-type')||'';if(!ct.includes('application/json'))throw new Error('Server mengembalikan error '+res.status+'. Coba kembali.');}return res.json()}).then(payload=>{if(!payload||payload.ok===false){finish(error=>reject(new Error(error&&error.message?error.message:String(error))))(payload&&payload.error?payload.error:'Terjadi gangguan server admin.')}else{finish(resolve)(payload.data!==undefined?payload.data:payload)}}).catch(finish(error=>reject(new Error(error&&error.message?error.message:String(error)))))})}
    function toast(message,undoFn,duration){const el=document.createElement('div');el.className='toast';if(undoFn){el.innerHTML='<span>'+esc(message)+'</span><button class="toast-undo">Urungkan</button>';el.querySelector('.toast-undo').addEventListener('click',()=>{undoFn();el.remove()})}else{el.textContent=message}$('#toasts').append(el);const t=setTimeout(()=>el.remove(),duration||4200);if(undoFn)el.querySelector('.toast-undo').addEventListener('click',()=>clearTimeout(t))}
    function setBusy(button,busy,label){if(!button)return;button.disabled=busy;if(busy){button.dataset.old=button.innerHTML;button.textContent=label||'Memproses…'}else if(button.dataset.old){button.innerHTML=button.dataset.old;delete button.dataset.old}}
    function status(value){const raw=String(value||'DRAFT').toUpperCase(),key=raw.toLowerCase(),labels={DRAFT:'Draf',PENDING:'Menunggu Tinjauan',REVIEW:'Sedang Ditinjau',APPROVED:'Sudah Disetujui',PUBLISH:'Sudah Terbit',REJECTED:'Perlu Revisi'};return '<span class="status '+key+'" title="Status: '+attr(labels[raw]||raw)+'">'+esc(labels[raw]||raw)+'</span>'}
    function friendlyEntity(key){const item=(state.boot.entities||[]).find(e=>e.key===key);return item?item.label:key}
    function initials(name){return String(name||'A').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
    function applyTheme(theme){document.documentElement.dataset.theme=theme;localStorage.setItem('galilea:admin-theme',theme);const button=$('#theme-toggle');if(button)button.innerHTML=icon(theme==='dark'?'sun':'moon')}
    function currentTheme(){return localStorage.getItem('galilea:admin-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}

    function shell(){
      const user=state.boot.user, d=state.boot.dashboard;
      const entityNav=state.boot.entities.filter(e=>!['settings','schedule'].includes(e.key)).map(e=>nav(e.key,e.icon,e.label)).join('');
      return '<div class="admin-shell"><div class="mobile-overlay" id="overlay"></div><aside class="sidebar" id="sidebar"><a class="brand" href="#dashboard">'+logoMark('brand-logo')+'<span><strong>GMAHK Galilea</strong><span>Admin</span></span></a><div class="nav-scroll"><div class="nav-label">OVERVIEW</div>'+nav('dashboard','grid','Dashboard')+'<div class="nav-label">KONTEN</div>'+entityNav+nav('settings','settings','Pengaturan')+'<div class="nav-label">IBADAH</div>'+nav('schedule','calendar','Jadwal Pelayanan')+(user.permissions.edit?'<div class="nav-label">JEMAAT</div>'+nav('services','heart','Layanan Jemaat'):'')+(user.permissions.approve?nav('approvals','check','Persetujuan'):'')+(user.permissions.approve?nav('activity','clock','Aktivitas'):'')+(user.permissions.manageAdmins?nav('users','shield','Pengelola'):'')+(user.permissions.edit?nav('system','settings','Sistem'):'')+'</div><div class="sidebar-user"><div class="user-row"><span class="avatar">'+esc(initials(user.name))+'</span><span><strong>'+esc(user.name)+'</strong><span>'+esc(user.role)+'</span></span></div></div></aside><section class="workspace"><header class="topbar"><div class="button-row"><button class="icon-btn mobile-menu" id="mobile-menu" aria-label="Buka menu">'+icon('menu')+'</button><div class="crumb"><strong id="crumb-title">Dashboard</strong><span>GMAHK Galilea</span></div></div><div class="top-actions"><div style="position:relative"><button class="icon-btn" id="notif-toggle" aria-label="Notifikasi">'+icon('bell')+'<span class="count" id="notif-badge" style="position:absolute;top:-4px;right:-4px;padding:0 4px;font-size:10px" hidden>0</span></button><div id="notif-panel" class="card" style="position:absolute;top:100%;right:0;width:290px;display:none;flex-direction:column;gap:8px;padding:12px;z-index:100;box-shadow:var(--shadow-lg);margin-top:8px"></div></div><a class="icon-btn" href="'+attr(state.boot.publicSite.publicUrl||APP_URL)+'" target="_blank" rel="noopener" title="Buka website">'+icon('external')+'</a><button class="icon-btn" id="theme-toggle" aria-label="Ganti tema">'+icon(currentTheme()==='dark'?'sun':'moon')+'</button></div></header><main class="content" id="content"></main><footer class="admin-footer"><div class="footer-inner"><span>GMAHK Galilea Balikpapan</span><span class="faint">Google Sheets · Vercel Edge</span></div></footer></section></div>';
    }
    function nav(route,iconName,label,count){const value=Math.max(0,Number(count)||0);return '<button class="nav-item" data-route="'+attr(route)+'">'+icon(iconName)+'<span>'+esc(label)+'</span><span class="count" data-nav-count="'+attr(route)+'" '+(value?'':'hidden')+'>'+esc(value)+'</span></button>'}
    function closeSidebar(){$('#sidebar')?.classList.remove('open');$('#overlay')?.classList.remove('open')}
    function routeTitle(){if(state.route==='dashboard')return'Dashboard';if(state.route==='services')return'Layanan Jemaat';if(state.route==='approvals')return'Persetujuan';if(state.route==='activity')return'Audit & Aktivitas';if(state.route==='users')return'Pengelola Portal';if(state.route==='system')return'Sistem & Backup';return friendlyEntity(state.route)}
    function navigate(route){state.route=route;state.search='';state.status='ALL';location.hash=route;$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.route===route));$('#crumb-title').textContent=routeTitle();closeSidebar();renderRoute()}

    async function renderRoute(){const box=$('#content');box.innerHTML=loadingCard('Menyiapkan '+routeTitle());try{if(state.route==='dashboard')return renderDashboard();if(state.route==='services')return await loadServices();if(state.route==='approvals')return await loadApprovals();if(state.route==='activity')return await loadActivity();if(state.route==='users')return await loadUsers();if(state.route==='system')return renderSystem();return await loadEntity(state.route)}catch(error){box.innerHTML=errorBox(error.message)}}
    function loadingCard(label){return '<div class="empty"><div class="loader-mark" style="width:72px;height:72px"><span class="orbit"></span>'+logoMark('loader-advent')+'</div><strong>'+esc(label||'Memuat')+'</strong><p class="muted small">Menyambungkan data terbaru…</p></div>'}
    function errorBox(message){return '<div class="empty">'+icon('info')+'<h3>Bagian ini belum dapat dimuat</h3><p>'+esc(cleanError(message))+'</p><button class="btn" data-retry>Coba kembali</button></div>'}
    function cleanError(message){return String(message||'Terjadi gangguan.').replace(/^(?:LOGIN_REQUIRED|ADMIN_NOT_READY|ACCESS_DENIED|FORBIDDEN)\|/,'')}

    function renderDashboard(){
      const d=state.boot.dashboard, u=state.boot.user, canEdit=u.permissions.edit, loading=Boolean(d.loading), publicToday=String(state.boot.publicSite.publicUrl||APP_URL).replace(/#.*$/,'')+'#today';
      const heroActions=canEdit?'<div class="welcome-actions"><button class="btn primary" data-route="worshipPlans">'+icon('plus')+'Siapkan ibadah</button><button class="btn" data-route="schedule">Edit jadwal</button><a class="btn soft" href="'+attr(publicToday)+'" target="_blank" rel="noopener">Mode Operator '+icon('external')+'</a></div>':'';
      const quickItems=canEdit?
        quick('worshipPlans','layout','Susunan Ibadah','Tema, ayat, lagu, dan liturgi Sabat.')+
        quick('themeSong','music','Lagu Tema','Ayat 1, Ayat 2, ayat tambahan, dan Refrain.')+
        quick('announcements','bell','Agenda dan Pengumuman','Warta jemaat aktif dan pengumuman.')+
        quick('activities','newspaper','Berita Jemaat','Dokumentasi kegiatan gereja yang berlangsung.')+
        quick('schedule','calendar','Jadwal Pelayanan','Tugas diaken, khotbah, dan pembagian ibadah.')+
        quick('services','heart','Layanan Jemaat','Tindak lanjuti pokok doa dan kunjungan.')+
        quick('system','settings','Kesehatan Sistem','Pemeriksaan cache, sumber data, dan cadangan.')
        :
        quick('worshipPlans','layout','Susunan Ibadah','Lihat susunan ibadah aktif.')+
        quick('themeSong','music','Lagu Tema','Lihat lirik lagu tema aktif.')+
        quick('announcements','bell','Agenda dan Pengumuman','Lihat informasi warta yang diterbitkan.');

      const syncClass=d.error?' is-error':loading?' is-loading':'';
      const syncText=d.error?'Statistik belum tersambung: '+d.error:loading?'Portal siap. Memperbarui statistik…':'Data terhubung · Google Sheets '+esc(d.scheduleSheet||'Triwulan III 2026')+' · '+d.updatedAt;
      const syncAction=loading?''+'':'<button class="btn-sync" type="button" data-dashboard-refresh>'+icon('refresh')+(d.error?'Coba lagi':'Perbarui')+'</button>';
      const metricValue=value=>loading?'—':value==null?'—':value;

      // Attention section: hanya tampil kalau ada item
      const pendingVal=Number(d.pendingApprovals)||0;
      const draftVal=Number(d.myDrafts)||0;
      const serviceVal=Number(d.serviceRequests)||0;
      const totalAttention=pendingVal+draftVal+serviceVal;
      let attentionItems='';
      if(pendingVal>0)attentionItems+='<button class="attention-item" data-route="approvals"><span class="attention-count">'+pendingVal+'</span><div class="attention-text"><strong>Persetujuan menunggu tinjauan</strong><span>Konten sudah diajukan dan perlu keputusan Anda</span></div><span class="attention-arrow">'+icon('external')+'</span></button>';
      if(draftVal>0)attentionItems+='<button class="attention-item" data-route="approvals"><span class="attention-count">'+draftVal+'</span><div class="attention-text"><strong>Draft belum diajukan</strong><span>Konten dalam proses penulisan</span></div><span class="attention-arrow">'+icon('external')+'</span></button>';
      if(serviceVal>0)attentionItems+='<button class="attention-item" data-route="services"><span class="attention-count">'+serviceVal+'</span><div class="attention-text"><strong>Layanan jemaat perlu tindak lanjut</strong><span>Permohonan baru atau sedang diproses</span></div><span class="attention-arrow">'+icon('external')+'</span></button>';
      const attentionSection=(!loading&&totalAttention>0)?
        '<section class="dashboard-attention-section">'+
          '<div class="attention-header"><h2>Perlu Perhatian</h2><span class="attention-badge">'+totalAttention+'</span></div>'+
          '<div class="attention-list">'+attentionItems+'</div>'+
        '</section>':'';

      $('#content').innerHTML =
        '<section class="editorial-welcome">' +
          '<div class="welcome-eyebrow"><span>GMAHK GALILEA</span><span class="eyebrow-sep">·</span><span>CONTROL CENTER</span></div>' +
          '<h1 class="welcome-title">Selamat datang, '+esc(u.name)+'.</h1>' +
          '<div class="welcome-meta">' +
            '<span class="welcome-meta-item"><span class="welcome-meta-status">'+esc(u.role)+'</span></span>' +
            (d.scheduleSheet?'<span class="welcome-meta-dot"></span><span class="welcome-meta-item">'+esc(d.scheduleSheet)+'</span>':'')+
            (d.systemStatus?'<span class="welcome-meta-dot"></span><span class="welcome-meta-item">'+esc(d.systemStatus)+'</span>':'')+
          '</div>' +
          '<p class="welcome-sub">'+(canEdit?'Kelola seluruh konten website, jadwal ibadah, dan pelayanan jemaat dalam satu ruang kerja yang tenang dan tertata.':'Akses peninjauan Anda siap. Seluruh konten publik dapat diperiksa secara aman.')+'</p>' +
          heroActions +
          '<div class="dashboard-sync-strip'+syncClass+'">' +
            '<span class="sync-meta">'+icon(d.error?'info':'refresh')+'<span>'+esc(syncText)+'</span></span>' +
            syncAction +
          '</div>' +
        '</section>' +
        attentionSection +
        '<section class="editorial-metrics-section">' +
          '<div class="section-label">RINGKASAN AKTIVITAS</div>' +
          '<div class="editorial-metrics-bar">' +
            metric('check', metricValue(d.pendingApprovals), 'Persetujuan', 'Menunggu review', loading) +
            '<div class="metric-divider"></div>' +
            metric('edit', metricValue(d.myDrafts), 'Draft Saya', 'Belum diajukan', loading) +
            '<div class="metric-divider"></div>' +
            metric('bell', metricValue(d.activeAnnouncements), 'Agenda Warta', 'Sedang aktif', loading) +
            '<div class="metric-divider"></div>' +
            metric('heart', metricValue(d.serviceRequests), 'Layanan Jemaat', 'Perlu ditangani', loading) +
          '</div>' +
        '</section>' +
        '<section class="editorial-actions-section">' +
          '<div class="section-head-clean">' +
            '<div>' +
              '<div class="section-label">AKSES CEPAT</div>' +
              '<h2>Tindakan Utama Pelayanan</h2>' +
            '</div>' +
          '</div>' +
          '<div class="actions-list-grid">' + quickItems + '</div>' +
        '</section>';
    }
    function metric(iconName, value, title, subtitle, loading){
      return '<article class="metric-block '+(loading?'is-loading':'')+'">' +
        '<div class="metric-top"><span class="metric-name">'+esc(title)+'</span><span class="metric-icon-small">'+icon(iconName)+'</span></div>' +
        '<strong class="metric-number">'+esc(value)+'</strong>' +
        '<span class="metric-caption">'+esc(subtitle)+'</span>' +
      '</article>';
    }
    function quick(route, iconName, title, description){
      return '<button class="action-tile" data-route="'+route+'">' +
        '<span class="action-tile-icon">'+icon(iconName)+'</span>' +
        '<div class="action-tile-body">' +
          '<strong>'+esc(title)+'</strong>' +
          '<span>'+esc(description)+'</span>' +
        '</div>' +
        '<span class="action-tile-arrow">'+icon('external')+'</span>' +
      '</button>';
    }

    function syncNotifications(){
      if(!state.boot||!state.boot.dashboard)return;
      const d=state.boot.dashboard;
      const pending=Math.max(0,Number(d.pendingApprovals)||0);
      const drafts=Math.max(0,Number(d.myDrafts)||0);
      const services=Math.max(0,Number(d.serviceRequests)||0);
      const total=pending+drafts+services;
      const badge=$('#notif-badge');
      if(badge){badge.textContent=total;badge.hidden=!total}
      const panel=$('#notif-panel');
      if(panel){
        let html='<div style="font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px">Notifikasi</div>';
        if(total===0)html+='<div class="muted small" style="padding:12px 0;text-align:center">Tidak ada pemberitahuan baru.</div>';
        else{
          if(pending>0)html+='<button class="nav-item" data-route="approvals" style="width:100%;justify-content:flex-start;height:auto;padding:8px">'+icon('check')+'<span style="white-space:normal;text-align:left">'+pending+' persetujuan menunggu</span></button>';
          if(drafts>0)html+='<button class="nav-item" data-route="dashboard" style="width:100%;justify-content:flex-start;height:auto;padding:8px">'+icon('edit')+'<span style="white-space:normal;text-align:left">'+drafts+' draft perlu direvisi</span></button>';
          if(services>0)html+='<button class="nav-item" data-route="services" style="width:100%;justify-content:flex-start;height:auto;padding:8px">'+icon('heart')+'<span style="white-space:normal;text-align:left">'+services+' layanan jemaat baru</span></button>';
        }
        panel.innerHTML=html;
      }
    }
    async function loadDashboardSummary(showError){if(!state.boot)return;const request=++state.dashboardRequest;state.boot.dashboard.loading=true;state.boot.dashboard.error='';if(state.route==='dashboard')renderDashboard();try{const result=await server('adminGetDashboardSummary',[],32000);if(request!==state.dashboardRequest)return;if(result&&result.dashboard)state.boot.dashboard=Object.assign({},state.boot.dashboard,result.dashboard,{loading:false,error:''});if(result&&result.publicSite)state.boot.publicSite=Object.assign({},state.boot.publicSite,result.publicSite);syncNotifications();if(state.route==='dashboard')renderDashboard()}catch(error){if(request!==state.dashboardRequest)return;state.boot.dashboard.loading=false;state.boot.dashboard.error=cleanError(error.message);if(state.route==='dashboard')renderDashboard();if(showError)toast(state.boot.dashboard.error)}}

    async function loadActivity(){state.activity=await server('adminGetDashboardActivity',[]);const audit=state.activity.audit||[],health=state.activity.health||[];$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">JEJAK PERUBAHAN</span><h1>Audit & Aktivitas</h1><p>Riwayat tindakan pengelola dan hasil pemeriksaan sumber terakhir.</p></div><button class="btn" data-reload>'+icon('refresh')+'Muat ulang</button></div><div class="grid grid-2"><section><div class="section-head" style="margin-top:0"><h3>Aktivitas terbaru</h3></div><div class="activity-list">'+(audit.length?audit.map(activityHtml).join(''):emptyHtml('Belum ada aktivitas yang tercatat.'))+'</div></section><section><div class="section-head" style="margin-top:0"><h3>Status sumber terakhir</h3></div><div class="activity-list">'+(health.length?health.map(item=>'<article class="activity-row"><span class="activity-dot"></span><div><strong>'+esc(item.source)+'</strong><span>'+esc(item.note||'Tidak ada catatan.')+'</span></div>'+status(item.status)+'</article>').join(''):emptyHtml('Pemeriksaan sistem belum pernah dijalankan.'))+'</div></section></div>'}
    function activityHtml(item){return '<article class="activity-row"><span class="activity-dot"></span><div><strong>'+esc(item.name||item.email)+' · '+esc(item.action)+'</strong><span>'+esc(friendlyEntity(item.entity))+(item.detail?' · '+esc(item.detail):'')+'</span></div><time>'+esc(item.time)+'</time></article>'}

    async function loadEntity(key){state.entity=key;state.entityData=await server('adminListEntity',[key]);renderEntity()}
    function renderEntity(){const data=state.entityData,canEdit=state.boot.user.permissions.edit;let records=data.records||[];const query=state.search.toLowerCase();if(query)records=records.filter(r=>JSON.stringify(r).toLowerCase().includes(query));if(state.status!=='ALL')records=records.filter(r=>String(r.status).toUpperCase()===state.status);const canAdd=canEdit&&data.entity!=='settings';const legend='<div class="status-legend">'+status('DRAFT')+status('PENDING')+status('REJECTED')+status('PUBLISH')+'<span>Hanya konten berstatus Sudah Terbit yang tampil ke jemaat.</span></div>';$('#content').innerHTML='<div class="page-head"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h1>'+esc(data.label)+'</h1><p>Perubahan disimpan sebagai draf, diperiksa, lalu tampil setelah disetujui.</p></div>'+(canAdd?'<button class="btn primary" data-new-record>'+icon('plus')+'Tambah '+esc(data.label)+'</button>':'')+'</div>'+legend+workflowHtml(data.workflows||[])+'<div class="toolbar"><label class="search">'+icon('search')+'<input id="entity-search" placeholder="Cari '+attr(data.label.toLowerCase())+'…" value="'+attr(state.search)+'"></label><div class="filters"><select id="entity-status"><option value="ALL" '+(state.status==='ALL'?'selected':'')+'>Semua status</option><option value="PUBLISH" '+(state.status==='PUBLISH'?'selected':'')+'>Sudah Terbit</option><option value="DRAFT" '+(state.status==='DRAFT'?'selected':'')+'>Draf</option></select><button class="icon-btn" data-reload title="Muat ulang">'+icon('refresh')+'</button></div></div><div class="record-grid">'+(records.length?records.map(recordHtml).join(''):emptyHtml('Belum ada konten yang sesuai.'))+'</div>'}

    function settingFieldConfig(record,field){
      const id=String(record&&record.id||'');
      const choices={
        presentation_ornaments_enabled:['YA','TIDAK'],
        presentation_ornament_strength:['LEMBUT','SEIMBANG','JELAS'],
        presentation_schedule_ornament:['AUTO','CHURCH','CALENDAR','BOOK','MUSIC','USERS','BELL','HEART'],

        presentation_announcement_ornament:['AUTO','BELL','CALENDAR','BOOK','USERS','HEART'],
